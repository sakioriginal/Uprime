<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>LineageVR v0.3</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css"><script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script></head><body>
<div id="topbar"><b>LineageVR v0.3</b><button id="mode2d">2D戦略</button><button id="mode3d">3D/VR</button><button id="saveBtn">保存</button><button id="loadBtn">読込</button><span id="status">起動中</span></div>
<div id="panel"><h3>操作キャラ</h3><div id="charList"></div><h3>ガンビット</h3><select id="gambitSelect"><option value="balanced">バランス型</option><option value="aggressive">攻撃型</option><option value="worker">労働効率型</option></select><button id="applyGambit">適用</button><h3>訓練</h3><button id="trainSword">剣術訓練</button><button id="trainWork">労働訓練</button><button id="teachFromPlayer">プレイヤー操作を学習</button><p class="hint">VR/3Dは直接操作、2Dは戦略・集団命令・ガンビット編集向き。</p></div>
<div id="map2d"><canvas id="strategyCanvas" width="900" height="560"></canvas></div>
<a-scene id="scene3d" embedded renderer="antialias:true;colorManagement:true" background="color:#9ed0ff" vr-mode-ui="enabled:true" lineage-game>
<a-entity light="type:ambient;intensity:0.6"></a-entity><a-entity light="type:directional;intensity:0.8" position="3 6 4"></a-entity><a-plane rotation="-90 0 0" width="80" height="80" color="#6fba5e"></a-plane>
<a-box position="-5 0.55 -8" width="2.3" height="1.1" depth="2" color="#9b6b3d"></a-box><a-cone position="-5 1.85 -8" radius-bottom="1.9" height="1.5" color="#6b3020"></a-cone><a-cylinder position="4 0.6 -7" radius="0.35" height="1.2" color="#8b5a2b"></a-cylinder><a-cone position="4 1.8 -7" radius-bottom="1.35" height="2.2" color="#2f8f45"></a-cone>
<a-entity id="rig" position="0 0 0"><a-entity id="camera" camera look-controls wasd-controls position="0 1.6 0"><a-cursor color="#fff" fuse="false"></a-cursor></a-entity><a-entity id="leftHand" laser-controls="hand:left"></a-entity><a-entity id="rightHand" laser-controls="hand:right" sword-controller></a-entity></a-entity>
<a-entity id="sword" sword position="0.6 1.05 -1.2" rotation="0 0 -35"><a-cylinder position="0 0.45 0" radius="0.035" height="0.9" color="#d8e6f0"></a-cylinder><a-box position="0 0 0" width="0.35" height="0.06" depth="0.06" color="#c8a13c"></a-box><a-cylinder position="0 -0.22 0" radius="0.045" height="0.42" color="#4c2b18"></a-cylinder></a-entity>
<a-entity id="enemy1" enemy position="2 0 -8"><a-sphere class="enemyBody" position="0 0.55 0" radius="0.55" color="#9b72ff"></a-sphere><a-sphere position="-0.17 0.72 0.46" radius="0.06" color="#111"></a-sphere><a-sphere position="0.17 0.72 0.46" radius="0.06" color="#111"></a-sphere><a-text value="魔獣" align="center" position="0 1.45 0" color="#222" scale="0.5 0.5 0.5"></a-text></a-entity>
<a-text id="worldText" value="2D/3D/VR 同じ世界" position="0 2.5 -3.3" align="center" color="#222" scale="0.6 0.6 0.6"></a-text></a-scene>
<script src="js/app.js"></script></body></html>
