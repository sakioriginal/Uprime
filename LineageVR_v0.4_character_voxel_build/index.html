<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>LineageVR v0.4</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css"><script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script></head><body>
<div id="topbar"><b>LineageVR v0.4</b><button id="mode2d">2D戦略</button><button id="mode3d">3D/VR</button><button id="charBtn">キャラメイク</button><button id="digBtn">掘る</button><button id="placeBtn">置く</button><button id="buildWall">壁</button><button id="buildHouse">家</button><button id="saveBtn">保存</button><button id="loadBtn">読込</button><span id="status">起動中...</span></div>
<div id="panel"><h3>操作キャラ</h3><div id="charList"></div><h3>キャラ情報</h3><div id="charInfo"></div><h3>命令</h3><button id="followBtn">味方追従</button><button id="stopBtn">待機</button><h3>訓練</h3><button id="trainSword">剣術訓練</button><button id="trainWork">労働訓練</button><button id="teachFromPlayer">操作を学習</button><h3>ガンビット</h3><select id="gambitSelect"><option value="balanced">バランス型</option><option value="aggressive">攻撃型</option><option value="worker">労働型</option><option value="guard">護衛型</option></select><button id="applyGambit">適用</button></div>
<div id="maker" class="modal hidden"><div class="modalBody"><h2>キャラメイク</h2><label>名前 <input id="mkName" value="あなた"></label><label>身長 <input id="mkHeight" type="range" min="145" max="210" value="170"><span id="mkHeightVal"></span></label><label>体重 <input id="mkWeight" type="range" min="40" max="130" value="65"><span id="mkWeightVal"></span></label><label>筋力 <input id="mkStr" type="range" min="1" max="10" value="5"></label><label>知能 <input id="mkInt" type="range" min="1" max="10" value="5"></label><label>器用 <input id="mkDex" type="range" min="1" max="10" value="5"></label><label>魅力 <input id="mkCha" type="range" min="1" max="10" value="5"></label><label>髪色 <input id="mkHair" type="color" value="#332211"></label><label>服色 <input id="mkCloth" type="color" value="#4aa3ff"></label><button id="applyChar">反映</button><button id="closeMaker">閉じる</button></div></div>
<div id="map2d"><canvas id="strategyCanvas" width="960" height="600"></canvas></div>
<a-scene id="scene3d" embedded renderer="antialias:true; colorManagement:true" background="color:#9ed0ff" vr-mode-ui="enabled:true" lineage-game><a-entity light="type:ambient; intensity:0.62"></a-entity><a-entity light="type:directional; intensity:0.85" position="3 6 4"></a-entity><a-plane rotation="-90 0 0" width="120" height="120" color="#5eaa54"></a-plane><a-entity id="terrainLayer"></a-entity><a-entity id="npcLayer"></a-entity><a-entity id="buildLayer"></a-entity><a-entity id="rig" position="0 0 0" vr-locomotion><a-entity id="camera" camera look-controls wasd-controls position="0 1.6 0"><a-cursor color="#fff" fuse="false"></a-cursor></a-entity><a-entity id="leftHand" laser-controls="hand:left"></a-entity><a-entity id="rightHand" laser-controls="hand:right" sword-controller></a-entity></a-entity><a-entity id="sword" sword position="0.65 1.05 -1.2" rotation="0 0 -35"><a-cylinder position="0 0.55 0" radius="0.035" height="1.1" color="#d8e6f0"></a-cylinder><a-box position="0 0 0" width="0.38" height="0.06" depth="0.06" color="#c8a13c"></a-box><a-cylinder position="0 -0.23 0" radius="0.045" height="0.44" color="#4c2b18"></a-cylinder></a-entity><a-entity id="enemy1" enemy position="2 0 -8"><a-sphere class="enemyBody" position="0 0.55 0" radius="0.55" color="#9b72ff"></a-sphere><a-sphere position="-0.17 0.72 0.46" radius="0.06" color="#111"></a-sphere><a-sphere position="0.17 0.72 0.46" radius="0.06" color="#111"></a-sphere><a-text value="魔獣" align="center" position="0 1.45 0" color="#222" scale="0.5 0.5 0.5"></a-text></a-entity><a-text id="worldText" value="v0.4 キャラメイク + 掘れる地形" position="0 2.5 -3.3" align="center" color="#222" scale="0.6 0.6 0.6"></a-text></a-scene>
<script src="js/app.js"></script></body></html>
