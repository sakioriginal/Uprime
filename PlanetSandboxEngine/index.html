<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Planet Sandbox Engine - Static v0.1</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="hud">PSE loading...</div>

  <div id="topControls">
    <button id="settingsBtn" class="uiBtn">⚙️</button>
    <button id="zoomOutBtn" class="uiBtn">－</button>
    <button id="zoomInBtn" class="uiBtn">＋</button>
    <button id="buildBtn" class="uiBtn">🏠</button>
  </div>

  <div id="settingsPanel">
    <b>ABXY 割り当て</b><br />
    A <select data-bind="A"><option value="context">コンテキスト</option><option value="talk">会話</option><option value="gather">採集</option><option value="build">建築</option></select><br />
    B <select data-bind="B"><option value="cancel">キャンセル</option><option value="jump">ジャンプ</option></select><br />
    X <select data-bind="X"><option value="gather">採集</option><option value="talk">会話</option><option value="context">コンテキスト</option></select><br />
    Y <select data-bind="Y"><option value="build">建築</option><option value="gather">採集</option><option value="talk">会話</option></select>
  </div>

  <div id="dialog"></div>

  <div id="moveStick" class="stick"><div class="knob"></div><span>移動</span></div>
  <div id="lookStick" class="stick"><div class="knob"></div><span>視点</span></div>

  <div id="actionPad">
    <button id="btnY" class="actBtn" data-press="Y">Y</button>
    <button id="btnX" class="actBtn" data-press="X">X</button>
    <button id="btnB" class="actBtn" data-press="B">B</button>
    <button id="btnA" class="actBtn" data-press="A">A</button>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
