<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
<title>autophagy71_協働AIマインドマップ</title>
<link rel="stylesheet" href="./style64.css" />
</head>
<body>
<div id="app">
  <canvas id="canvas"></canvas>

  <div id="topBarPanel" class="floatingPanel">
    <div class="panelHeader">
      <div class="panelTitle">メインUI</div>
      <button id="pinTopBarBtn" class="pinBtn pinned" type="button">📌</button>
    </div>

    <div id="topBarBody">
      <button id="startBtn" type="button">開始</button>
      <button id="stopBtn" type="button">停止</button>
      <button id="saveBtn" type="button">保存</button>
      <button id="loadBtn" type="button">読込</button>
      <button id="fitBtn" type="button">全体表示</button>
      <button id="alignBtn" type="button">整列</button>
      <button id="settingsBtn" type="button">設定</button>
      <button id="toggleLogBtn" type="button">ログ▼</button>
      <button id="followBtn" type="button">追従:OFF</button>

      <input id="quickInput" type="text" inputmode="text" autocomplete="off" spellcheck="false" placeholder="ノード名 / 編集名 / 検索語" />

      <button id="quickEditBtn" type="button">編集✏️</button>
      <button id="quickAddBtn" type="button">新規＋✨</button>
      <button id="quickSearchBtn" type="button">検索🔍</button>

      <div class="spacer"></div>

      <button id="viewModeBtn" class="active" type="button">閲覧</button>
      <button id="editModeBtn" type="button">編集</button>
      <button id="linkModeBtn" type="button">リンク</button>
      <button id="pruneModeBtn" type="button">剪定✂️</button>
    </div>
  </div>

  <div id="settingsPanel" class="floatingPanel">
    <div class="panelHeader">
      <div class="panelTitle">設定</div>
      <button id="pinSettingsBtn" class="pinBtn pinned" type="button">📌</button>
    </div>

    <div id="settingsBody">
      <div class="tabRow">
        <button id="tabAgentBtn" class="active" type="button">エージェント</button>
        <button id="tabViewBtn" type="button">表示</button>
        <button id="tabPhysicsBtn" type="button">物理</button>
        <button id="tabDataBtn" type="button">データ</button>
      </div>

      <div id="settingsAgentSection" class="card"></div>
      <div id="settingsViewSection" class="card" style="display:none;"></div>
      <div id="settingsPhysicsSection" class="card" style="display:none;"></div>
      <div id="settingsDataSection" class="card" style="display:none;"></div>
    </div>
  </div>

  <div id="nodeDetailPanel" class="floatingPanel">
    <div class="panelHeader">
      <div class="panelTitle">ノード詳細</div>
      <button id="toggleNodeDetailBtn" class="pinBtn" type="button">▼</button>
      <button id="pinDetailBtn" class="pinBtn pinned" type="button">📌</button>
    </div>
    <div id="nodeDetailBody">未選択</div>
  </div>

  <div id="nodePropPanel" class="floatingPanel">
    <div class="panelHeader">
      <div class="panelTitle">ノードプロパティ</div>
      <button id="pinPropBtn" class="pinBtn pinned" type="button">📌</button>
    </div>

    <div id="nodePropBody">
      <div class="propGrid">
        <label class="propLabel" for="propNameInput">名前</label>
        <input id="propNameInput" class="entryBox" type="text" inputmode="text" autocomplete="off" spellcheck="false" />

        <label class="propLabel" for="propXInput">X</label>
        <input id="propXInput" class="entryBox" type="number" inputmode="decimal" />

        <label class="propLabel" for="propYInput">Y</label>
        <input id="propYInput" class="entryBox" type="number" inputmode="decimal" />

        <label class="propLabel" for="propZInput">Z</label>
        <input id="propZInput" class="entryBox" type="number" inputmode="decimal" />

        <label class="propLabel" for="propWeightInput">重み</label>
        <input id="propWeightInput" class="entryBox" type="number" inputmode="decimal" step="1" />

        <label class="propLabel" for="propShapeSelect">形</label>
        <select id="propShapeSelect" class="entryBox">
          <option value="circle">円</option>
          <option value="rect">四角</option>
        </select>

        <label class="propLabel" for="propRadiusInput">半径</label>
        <input id="propRadiusInput" class="entryBox" type="number" inputmode="decimal" />

        <label class="propLabel" for="propWidthInput">幅</label>
        <input id="propWidthInput" class="entryBox" type="number" inputmode="decimal" />

        <label class="propLabel" for="propHeightInput">高さ</label>
        <input id="propHeightInput" class="entryBox" type="number" inputmode="decimal" />

        <label class="propLabel" for="propThumbInput">サムネ画像</label>
        <input id="propThumbInput" class="entryBox" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="画像URL / dataURL" />

        <label class="propLabel" for="propVisibleChk">表示</label>
        <label class="propCheckRow">
          <input id="propVisibleChk" type="checkbox" />
          <span>表示する</span>
        </label>

        <label class="propLabel" for="propFixedChk">固定⚓️</label>
        <label class="propCheckRow">
          <input id="propFixedChk" type="checkbox" />
          <span>固定する</span>
        </label>

        <label class="propLabel" for="propAuthorView">オーサー</label>
        <input id="propAuthorView" class="entryBox isReadOnly" type="text" readonly value="非表示 / 変更不可" />
      </div>

      <div class="propButtons">
        <button id="propApplyBtn" type="button">反映</button>
        <button id="propDeleteNodeBtn" type="button">ノード削除✂️</button>
        <button id="propCutLinksBtn" type="button">リンク切断✂️</button>
      </div>
    </div>
  </div>

  <div id="hint">
    閲覧: エージェントを選択 → 行き先ノードをタップで移動指定<br>
    編集: ダブルタップで編集 / 空白長押しで新規ノード / 画像ノードは右下ハンドルでサイズ変更<br>
    リンク: 1個目のノード選択 → 2個目で接続<br>
    剪定: ノード削除 / リンク切断
  </div>

  <div id="modeBadge">モード: 閲覧</div>

  <div id="miniInfo">
    ノード: <span id="nodeCount">0</span><br />
    リンク: <span id="linkCount">0</span><br />
    選択: <span id="selectedInfo">なし</span><br />
    エージェント: <span id="agentCountMini">0</span><br />
    追従: <span id="followMini">なし</span>
  </div>

  <div id="zoomHud">100%</div>

  <div id="zoomControls">
    <button id="zoomInBtn" type="button">＋</button>
    <button id="zoomOutBtn" type="button">－</button>
  </div>

  <div id="stickWrap">
    <div id="stickBase"></div>
    <div id="stickKnob"></div>
  </div>

  <div id="logWrap">
    <div id="logPanel" class="collapsed">
      <div id="log"></div>
    </div>
  </div>

  <div id="nodeEditor">
    <h3>ノード編集</h3>
    <input id="nodeLabelInput" class="entryBox" type="text" inputmode="text" autocomplete="off" spellcheck="false" placeholder="表示名" />
    <textarea id="nodeMemoInput" class="entryBox" placeholder="メモ"></textarea>
    <select id="nodeColorInput" class="entryBox">
      <option value="#2b3344">標準</option>
      <option value="#34495e">青灰</option>
      <option value="#3d2f52">紫</option>
      <option value="#324d3a">緑</option>
      <option value="#5a3b32">茶</option>
      <option value="#4e364f">桃紫</option>
    </select>
    <div class="buttons">
      <button id="nodeSaveBtn" type="button">保存</button>
      <button id="nodeDeleteBtn" type="button">削除</button>
      <button id="nodeCloseBtn" type="button">閉じる</button>
    </div>
  </div>

  <div id="legend">
    <div class="legendItem"><span class="dot" style="background:#2b3344"></span>通常</div>
    <div class="legendItem"><span class="dot" style="background:#ffd166"></span>5W2H</div>
    <div class="legendItem"><span class="dot" style="background:#7bdff2"></span>学際</div>
    <div class="legendItem"><span class="dot" style="background:#9cdcf0"></span>候補</div>
    <div class="legendItem"><span class="dot" style="background:#ff8be6"></span>エージェント</div>
  </div>

  <div id="youtubeOverlay" class="youtubeOverlay hidden">
    <div class="youtubeOverlayInner">
      <button id="closeYoutubeOverlayBtn" class="youtubeCloseBtn" type="button">閉じる</button>
      <div id="youtubePlayerWrap" class="youtubePlayerWrap"></div>
    </div>
  </div>
</div>

<script src="./app-state64.js"></script>
<script src="./app-utils64.js"></script>
<script src="./app-agents64.js"></script>
<script src="./app-main64.js"></script>
</body>
</html>
