<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no" />
  <title>autophagy70_協働AIマインドマップ</title>
  <link rel="stylesheet" href="style1.css?v=70" />
</head>
<body>
  <div id="app">
    <canvas id="canvas"></canvas>

    <div id="topBarPanel" class="floatingPanel">
      <div class="panelHeader">
        <div class="panelTitle">メインUI</div>
        <button id="pinTopBarBtn" class="pinBtn pinned" type="button">📌</button>
      </div>
      <div id="topBarBody">
        <button id="startBtn" type="button">開始</button>
        <button id="stopBtn" type="button">停止</button>
        <button id="saveBtn" type="button">保存</button>
        <button id="loadBtn" type="button">読込</button>
        <button id="fitBtn" type="button">全体表示</button>
        <button id="alignBtn" type="button">整列</button>
        <button id="settingsBtn" type="button">設定</button>
        <button id="toggleLogBtn" type="button">ログ▼</button>
        <button id="followBtn" type="button">追従:OFF</button>

        <input id="quickInput" type="text" placeholder="ノード名 / 編集名 / 検索語 / URL / YouTube URL"
          autocomplete="off" spellcheck="false" />
        <button id="quickInputClearBtn" type="button" title="入力クリア">✕</button>
        <button id="quickEditBtn" type="button">編集✏️</button>
        <button id="quickAddBtn" type="button">新規＋✨</button>
        <button id="quickSearchBtn" type="button">検索🔍</button>

        <div class="spacer"></div>

        <button id="viewModeBtn" class="active" type="button">👀</button>
        <button id="editModeBtn" type="button">✏</button>
        <button id="linkModeBtn" type="button">🔗</button>
        <button id="webModeBtn" type="button">🌐</button>
        <button id="pruneModeBtn" type="button">✂️</button>
      </div>
    </div>

    <div id="settingsPanel" class="floatingPanel">
      <div class="panelHeader">
        <div class="panelTitle">設定</div>
        <button id="pinSettingsBtn" class="pinBtn pinned" type="button">📌</button>
      </div>
      <div id="settingsBody">
        <div class="tabRow">
          <button id="tabAgentBtn" class="active" type="button">👦</button>
          <button id="tabViewBtn" type="button">💡</button>
          <button id="tabPhysicsBtn" type="button">🔗</button>
          <button id="tabDataBtn" type="button">💾</button>
          <button id="tabWorldBtn" type="button">🌎</button>
        </div>
        <div id="settingsAgentSection" class="card"></div>
        <div id="settingsViewSection" class="card" style="display:none;"></div>
        <div id="settingsPhysicsSection" class="card" style="display:none;"></div>
        <div id="settingsDataSection" class="card" style="display:none;"></div>
        <div id="settingsWorldSection" class="card" style="display:none;"></div>
      </div>
    </div>

    <div id="nodeDetailPanel" class="floatingPanel">
      <div class="panelHeader">
        <div class="panelTitle">詳細</div>
        <button id="toggleNodeDetailBtn" class="pinBtn" type="button">▼</button>
        <button id="pinDetailBtn" class="pinBtn pinned" type="button">📌</button>
      </div>
      <div id="nodeDetailBody">未選択</div>
    </div>

    <div id="hint">
      //閲覧: エージェント選択 → ノード選択で移動先指定<br />
      //編集: ダブルタップ編集 / 空白長押しで新規<br />
      //リンク: 1個目 → 2個目で接続<br />
      //🌐: ノード選択後に Web / 画像 / YouTube 検索<br />
      //✂️: 不要なノードや枝を剪定
    </div>

    <div id="modeBadge">モード: 閲覧</div>

    <div id="miniInfo">
      ノード: <span id="nodeCount">0</span><br />
      リンク: <span id="linkCount">0</span><br />
      選択: <span id="selectedInfo">なし</span><br />
      エージェント: <span id="agentCountMini">0</span><br />
      追従: <span id="followMini">なし</span><br />
      マップ: <span id="mapTypeMini">private</span><br />
      ユーザー: <span id="userNameMini">guest</span><br />
      Pt: <span id="userPointMini">0</span>
    </div>

    <div id="zoomHud">100%</div>
    <div id="zoomControls">
      <button id="zoomInBtn" type="button">＋</button>
      <button id="zoomOutBtn" type="button">－</button>
    </div>

    <div id="stickWrap">
      <div id="stickBase"></div>
      <div id="stickKnob"></div>
    </div>

    <div id="logWrap">
      <div id="logPanel" class="collapsed">
        <div id="log"></div>
      </div>
    </div>

    <div id="nodeEditor" class="editorPanel">
      <h3>ノード編集</h3>
      <div class="formRow"><label for="nodeLabelInput">名前</label><input id="nodeLabelInput" /></div>
      <div class="formGrid3">
        <div class="formRow"><label for="nodeXInput">X</label><input id="nodeXInput" type="number" step="1" /></div>
        <div class="formRow"><label for="nodeYInput">Y</label><input id="nodeYInput" type="number" step="1" /></div>
        <div class="formRow"><label for="nodeZInput">Z</label><input id="nodeZInput" type="number" step="1" /></div>
      </div>
      <div class="formGrid2">
        <div class="formRow"><label for="nodeWidthInput">幅</label><input id="nodeWidthInput" type="number" step="1" /></div>
        <div class="formRow"><label for="nodeHeightInput">高</label><input id="nodeHeightInput" type="number" step="1" /></div>
      </div>
      <div class="formGrid2">
        <div class="formRow"><label for="nodeRadiusInput">半径</label><input id="nodeRadiusInput" type="number" step="1" /></div>
        <div class="formRow"><label for="nodeShapeInput">形</label>
          <select id="nodeShapeInput"><option value="circle">円</option><option value="rect">矩形</option></select>
        </div>
      </div>
      <div class="formGrid2">
        <label class="checkRow"><input id="nodeFixedInput" type="checkbox" />固定⚓️</label>
        <label class="checkRow"><input id="nodeHiddenInput" type="checkbox" />非表示</label>
      </div>
      <div class="formRow"><label for="nodeThumbInput">サムネURL</label><input id="nodeThumbInput" /></div>
      <div class="formRow"><label for="nodeLinkInput">リンクURL</label><input id="nodeLinkInput" /></div>
      <div class="formRow"><label for="nodeMemoInput">メモ</label><textarea id="nodeMemoInput"></textarea></div>
      <div class="formRow"><label for="nodeColorInput">色</label>
        <select id="nodeColorInput">
          <option value="#2b3344">標準</option>
          <option value="#34495e">青灰</option>
          <option value="#3d2f52">紫</option>
          <option value="#324d3a">緑</option>
          <option value="#5a3b32">茶</option>
          <option value="#4e364f">桃紫</option>
        </select>
      </div>
      <div class="buttons">
        <button id="nodeSaveBtn" type="button">保存</button>
        <button id="nodeDeleteBtn" type="button">削除</button>
        <button id="nodeCloseBtn" type="button">閉じる</button>
      </div>
    </div>

    <div id="agentEditor" class="editorPanel">
      <h3>エージェント編集</h3>
      <div class="formRow"><label for="agentNameInput">名前</label><input id="agentNameInput" /></div>
      <div class="formRow"><label for="agentRoleInput">職業</label><select id="agentRoleInput"></select></div>
      <div class="formRow"><label for="agentDestinationInput">目的地</label><input id="agentDestinationInput" /></div>
      <div class="formGrid2">
        <div class="formRow"><label for="agentHpInput">HP</label><input id="agentHpInput" type="number" step="1" /></div>
        <div class="formRow"><label for="agentHungerInput">空腹</label><input id="agentHungerInput" type="number" step="1" /></div>
      </div>
      <div class="buttons">
        <button id="agentSaveBtn" type="button">保存</button>
        <button id="agentCloseBtn" type="button">閉じる</button>
      </div>
    </div>

    <div id="webSearchPanel" class="floatingPanel modalPanel hidden">
      <div class="panelHeader">
        <div class="panelTitle">🌐検索</div>
        <button id="closeWebSearchBtn" class="pinBtn" type="button">✕</button>
      </div>
      <div class="modalBody">
        <div class="segmentedRow">
          <button id="webSearchTabBtn" class="active" type="button">Web</button>
          <button id="imageSearchTabBtn" type="button">画像</button>
          <button id="youtubeSearchTabBtn" type="button">YouTube</button>
        </div>
        <div class="formRow"><label for="webSearchQueryInput">検索語</label><input id="webSearchQueryInput" /></div>
        <div class="buttons">
          <button id="runWebSearchBtn" type="button">検索</button>
          <button id="applyWebSearchSelectionBtn" type="button">選択追加</button>
        </div>
        <div id="webSearchStatus" class="miniNote">未検索</div>
        <div id="webSearchResults" class="searchResultList"></div>
      </div>
    </div>

    <div id="saveSlotPanel" class="floatingPanel modalPanel hidden">
      <div class="panelHeader">
        <div class="panelTitle">保存 / 読込</div>
        <button id="closeSaveSlotPanelBtn" class="pinBtn" type="button">✕</button>
      </div>
      <div class="modalBody">
        <div class="formGrid2">
          <div class="formRow"><label for="mapTypeSelect">マップ種別</label>
            <select id="mapTypeSelect"><option value="private">プライベート</option><option value="group">グループ</option><option value="world">ワールド</option></select>
          </div>
          <div class="formRow"><label for="userNameInput">ユーザー名</label><input id="userNameInput" /></div>
        </div>
        <div class="formRow"><label for="saveNameInput">保存名</label><input id="saveNameInput" /></div>
        <div class="buttons">
          <button id="saveToSlotBtn" type="button">この名前で保存</button>
          <button id="refreshSlotListBtn" type="button">一覧更新</button>
        </div>
        <div id="saveSlotModeText" class="miniNote" style="margin-top:8px;">保存モード</div>
        <div id="saveSlotList" class="slotList"></div>
      </div>
    </div>

    <div id="legend">
      <div class="legendItem"><span class="dot" style="background:#2b3344"></span>通常</div>
      <div class="legendItem"><span class="dot" style="background:#ffd166"></span>5W2H</div>
      <div class="legendItem"><span class="dot" style="background:#7bdff2"></span>学際</div>
      <div class="legendItem"><span class="dot" style="background:#9cdcf0"></span>候補</div>
      <div class="legendItem"><span class="dot" style="background:#ff8be6"></span>エージェント</div>
    </div>
  </div>

  <div id="youtubeOverlay" class="youtubeOverlay hidden">
    <div class="youtubeOverlayInner">
      <button id="closeYoutubeOverlayBtn" class="youtubeCloseBtn" type="button">✕</button>
      <div id="youtubePlayerWrap" class="youtubePlayerWrap"></div>
    </div>
  </div>

  <script src="app-state1.js?v=70"></script>
  <script src="app-utils1.js?v=70"></script>
  <script src="app-agents1.js?v=70"></script>
  <script src="app-main1.js?v=70"></script>
</body>
</html>
