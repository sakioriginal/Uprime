<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>MindCanvas MR (Quest 3)</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;}
  #hud{
    position:fixed; left:12px; top:12px; z-index:9999;
    color:#fff; font:12px/1.4 system-ui,-apple-system;
    background:rgba(0,0,0,.45); padding:8px 10px; border-radius:10px;
    max-width:min(92vw,520px);
  }
  #hud b{font-size:13px}
  #mcFrame{
    position:absolute;
    left:-99999px; top:-99999px;
    width:1280px; height:720px;
    border:0;
  }
</style>
</head>
<body>

<div id="hud">
  <b>MindCanvas MR (Quest3 / WebXR)</b><br>
  ・MR開始：右下の「Enter AR」<br>
  ・今は「表示」優先（リンク線canvasを転写）<br>
  ・次でレーザー入力（クリック/ドラッグ）を足せる
</div>

<!-- ★重要：MindCanvas本体を“別ファイル”で読む（壊れない） -->
<iframe id="mcFrame" src="./brainmap.html"></iframe>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
import { XRButton } from "https://unpkg.com/three@0.160.0/examples/jsm/webxr/XRButton.js";

const W = 1280, H = 720;
const CAPTURE_FPS = 15;

let scene, camera, renderer;
let panel, tex, capCanvas, capCtx;
let lastCap = 0;

init();

function init(){
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 30);

  renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setSize(innerWidth, innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  // Quest3のOculus BrowserでMR（パススルー）を狙う
  document.body.appendChild(
    XRButton.createButton(renderer, {
      requiredFeatures: ["local-floor"],
      optionalFeatures: ["passthrough"],
      mode: "immersive-ar"
    })
  );

  // 転写用キャンバス
  capCanvas = document.createElement("canvas");
  capCanvas.width = W; capCanvas.height = H;
  capCtx = capCanvas.getContext("2d");

  tex = new THREE.CanvasTexture(capCanvas);

  // パネル（実寸）
  const panelW = 1.35;
  const panelH = panelW * (H / W);
  panel = new THREE.Mesh(
    new THREE.PlaneGeometry(panelW, panelH),
    new THREE.MeshBasicMaterial({map: tex, transparent:true})
  );
  panel.position.set(0, 1.35, -1.2);
  scene.add(panel);

  renderer.setAnimationLoop(loop);

  addEventListener("resize", ()=>{
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
  }, {passive:true});
}

function loop(t){
  capture(t);
  renderer.render(scene, camera);
}

function capture(t){
  if(t - lastCap < (1000/CAPTURE_FPS)) return;
  lastCap = t;

  const iframe = document.getElementById("mcFrame");
  const doc = iframe.contentDocument;
  if(!doc) return;

  // MindCanvasの“リンク線・グリッド”はこのcanvasに描かれている（あなたの実装）
  const srcCanvas = doc.getElementById("layer");
  if(!srcCanvas) return;

  capCtx.clearRect(0,0,W,H);
  capCtx.drawImage(srcCanvas, 0,0, W,H);

  tex.needsUpdate = true;
}
</script>
</body>
</html>
