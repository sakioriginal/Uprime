<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MR BrainMap – Fixed</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;}
#hud{
  position:fixed;left:12px;top:12px;z-index:10;
  color:#fff;font:13px system-ui;
  background:rgba(0,0,0,.6);
  padding:10px 14px;border-radius:12px;
}
#editor{
  position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
  width:min(480px,90vw);
  background:rgba(20,25,40,.9);
  border-radius:14px;padding:10px;display:none;
}
#editor textarea{
  width:100%;height:80px;
  background:#000;color:#fff;
  border:none;border-radius:10px;
  padding:8px;font:14px system-ui;
}
</style>
</head>
<body>

<div id="hud">
✋ Grip：掴む / 移動<br>
🔗 Trigger：ポート接続<br>
⌨️ A：編集
</div>

<div id="editor">
  <textarea id="editText"></textarea>
</div>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
import { XRButton } from "https://unpkg.com/three@0.160.0/examples/jsm/webxr/XRButton.js";

let scene,camera,renderer;
let controller;
let nodes=[], links=[];
let grab=null, connect=null;
let selected=null;

const editor=document.getElementById("editor");
const editText=document.getElementById("editText");

init();
loop();

/* ---------- 初期化 ---------- */
function init(){
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.01,50);

  renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.xr.enabled=true;
  document.body.appendChild(renderer.domElement);
  document.body.appendChild(
    XRButton.createButton(renderer,{
      requiredFeatures:["local-floor"],
      optionalFeatures:["passthrough"]
    })
  );

  scene.add(new THREE.HemisphereLight(0xffffff,0x444444,1.2));
  scene.add(new THREE.GridHelper(10,10));

  controller=renderer.xr.getController(0);
  scene.add(controller);

  addNode(new THREE.Vector3(-0.3,1.4,-1),"Node A");
  addNode(new THREE.Vector3( 0.3,1.4,-1),"Node B");
}

/* ---------- ノード ---------- */
function addNode(pos,text){
  const g=new THREE.Group();

  const body=new THREE.Mesh(
    new THREE.PlaneGeometry(0.32,0.18),
    new THREE.MeshBasicMaterial({map:makeTex(text),transparent:true})
  );
  g.add(body);

  const inP=port(-0.18,0,0x66aaff,"in");
  const outP=port(0.18,0,0x66ff99,"out");
  g.add(inP,outP);

  g.position.copy(pos);
  g.userData={text,body,inP,outP};
  scene.add(g);
  nodes.push(g);
}

function port(x,y,c,t){
  const m=new THREE.Mesh(
    new THREE.CircleGeometry(0.025,16),
    new THREE.MeshBasicMaterial({color:c})
  );
  m.position.set(x,y,0.01);
  m.userData={port:t};
  return m;
}

function makeTex(text){
  const c=document.createElement("canvas");
  c.width=512;c.height=256;
  const g=c.getContext("2d");
  g.fillStyle="rgba(30,40,60,.9)";
  g.fillRect(0,0,512,256);
  g.strokeStyle="rgba(255,255,255,.25)";
  g.lineWidth=4;g.strokeRect(4,4,504,248);
  g.fillStyle="#fff";
  g.font="bold 36px system-ui";
  g.fillText(text,24,72);
  return new THREE.CanvasTexture(c);
}

/* ---------- 入力処理 ---------- */
function loop(){
  renderer.setAnimationLoop(()=>{
    handleGamepad();

    if(grab){
      grab.node.position.copy(ctrlPos().add(grab.offset));
    }

    nodes.forEach(n=>n.lookAt(camera.position));
    links.forEach(l=>{
      l.line.geometry.setFromPoints([l.a.position,l.b.position]);
    });

    renderer.render(scene,camera);
  });
}

function handleGamepad(){
  const gp=renderer.xr.getSession()?.inputSources[0]?.gamepad;
  if(!gp) return;

  // Grip（掴む）
  if(gp.buttons[1].pressed && !grab){
    const hit=pick();
    if(hit && !hit.object.userData.port){
      grab={
        node:hit.object.parent,
        offset:hit.object.parent.position.clone().sub(ctrlPos())
      };
      selected=hit.object.parent;
    }
  }
  if(!gp.buttons[1].pressed) grab=null;

  // Trigger（接続）
  if(gp.buttons[0].pressed && !connect){
    const hit=pick();
    if(hit?.object.userData.port==="out"){
      connect=hit.object.parent;
    }
  }
  if(!gp.buttons[0].pressed && connect){
    const hit=pick();
    if(hit?.object.userData.port==="in"){
      link(connect,hit.object.parent);
    }
    connect=null;
  }

  // Aボタン（編集）
  if(gp.buttons[4].pressed && selected){
    editor.style.display="block";
    editText.value=selected.userData.text;
  }
}

function link(a,b){
  const l=new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([a.position,b.position]),
    new THREE.LineBasicMaterial({color:0xffffff})
  );
  scene.add(l);
  links.push({a,b,line:l});
}

/* ---------- ピック ---------- */
function pick(){
  const r=new THREE.Raycaster();
  r.set(ctrlPos(), new THREE.Vector3(0,0,-1).applyQuaternion(controller.quaternion));
  return r.intersectObjects(scene.children,true)[0];
}

function ctrlPos(){
  const v=new THREE.Vector3();
  v.setFromMatrixPosition(controller.matrixWorld);
  return v;
}
</script>
</body>
</html>
