<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
  <title>協働AIマインドマップ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">
  <canvas id="canvas"></canvas>

  <div id="topBarPanel" class="floatingPanel">
    <div class="panelHeader">
      <div class="panelTitle">メインUI</div>
      <button id="pinTopBarBtn" class="pinBtn pinned">📌</button>
    </div>
    <div id="topBarBody">
      <button id="startBtn">開始</button>
      <button id="stopBtn">停止</button>
      <button id="saveBtn">保存</button>
      <button id="loadBtn">読込</button>
      <button id="fitBtn">全体表示</button>
      <button id="alignBtn">整列</button>
      <button id="settingsBtn">設定</button>
      <button id="toggleLogBtn">ログ▼</button>
      <button id="followBtn">追従:OFF</button>

      <input id="quickInput" type="text" placeholder="ノード名 / 編集名 / 検索語">

      <button id="quickEditBtn">編集✏️</button>
      <button id="quickAddBtn">新規＋✨</button>
      <button id="quickSearchBtn">検索🔍</button>

      <div class="spacer"></div>

      <button id="viewModeBtn" class="active">閲覧</button>
      <button id="editModeBtn">編集</button>
      <button id="linkModeBtn">リンク</button>
    </div>
  </div>

  <div id="settingsPanel" class="floatingPanel">
    <div class="panelHeader">
      <div class="panelTitle">設定</div>
      <button id="pinSettingsBtn" class="pinBtn pinned">📌</button>
    </div>
    <div id="settingsBody">
      <div class="tabRow">
        <button id="tabAgentBtn" class="active">エージェント</button>
        <button id="tabViewBtn">表示</button>
        <button id="tabPhysicsBtn">物理</button>
        <button id="tabDataBtn">データ</button>
      </div>
      <div id="settingsAgentSection" class="card"></div>
      <div id="settingsViewSection" class="card" style="display:none;"></div>
      <div id="settingsPhysicsSection" class="card" style="display:none;"></div>
      <div id="settingsDataSection" class="card" style="display:none;"></div>
    </div>
  </div>

  <div id="nodeDetailPanel" class="floatingPanel">
    <div class="panelHeader">
      <div class="panelTitle">ノード詳細</div>
      <button id="pinDetailBtn" class="pinBtn pinned">📌</button>
    </div>
    <div id="nodeDetailBody">未選択</div>
  </div>

  <div id="hint">
    閲覧: エージェントを選択 → 行き先ノードをタップで移動指定<br>
    編集: ダブルタップで編集 / 空白長押しで新規ノード<br>
    リンク: 1個目 → 2個目で接続
  </div>

  <div id="modeBadge">モード: 閲覧</div>

  <div id="miniInfo">
    ノード: <span id="nodeCount">0</span><br>
    リンク: <span id="linkCount">0</span><br>
    選択: <span id="selectedInfo">なし</span><br>
    エージェント: <span id="agentCountMini">0</span><br>
    追従: <span id="followMini">なし</span>
  </div>

  <div id="zoomHud">100%</div>

  <div id="zoomControls">
    <button id="zoomInBtn">＋</button>
    <button id="zoomOutBtn">－</button>
  </div>

  <div id="stickWrap">
    <div id="stickBase"></div>
    <div id="stickKnob"></div>
  </div>

  <div id="logWrap">
    <div id="logPanel" class="collapsed">
      <div id="log"></div>
    </div>
  </div>

  <div id="nodeEditor">
    <h3>ノード編集</h3>
    <input id="nodeLabelInput" placeholder="表示名">
    <textarea id="nodeMemoInput" placeholder="メモ"></textarea>
    <select id="nodeColorInput">
      <option value="#2b3344">標準</option>
      <option value="#34495e">青灰</option>
      <option value="#3d2f52">紫</option>
      <option value="#324d3a">緑</option>
      <option value="#5a3b32">茶</option>
    </select>
    <div class="buttons">
      <button id="nodeSaveBtn">保存</button>
      <button id="nodeDeleteBtn">削除</button>
      <button id="nodeCloseBtn">閉じる</button>
    </div>
  </div>

  <div id="legend">
    <div class="legendItem"><span class="dot"></span>通常</div>
    <div class="legendItem"><span class="dot"></span>5W2H</div>
    <div class="legendItem"><span class="dot"></span>学際</div>
    <div class="legendItem"><span class="dot"></span>候補</div>
    <div class="legendItem"><span class="dot"></span>エージェント</div>
  </div>
</div>

<script src="app-state.js"></script>
<script src="app-utils.js"></script>
<script src="app-agents.js"></script>
<script src="app-main.js"></script>
</body>
</html>
