<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
<title>autophagy50_協働AIマインドマップ 統合フル版</title>
<style>

:root{
  --bg:#0d1117;
  --panel:rgba(18,24,32,.92);
  --line:rgba(255,255,255,.12);
  --text:#eaf1ff;
  --muted:#9eb0cc;
  --shadow:0 10px 26px rgba(0,0,0,.28);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}

body{
  position:fixed;
  inset:0;
  overscroll-behavior:none;
}

#app{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 20%, rgba(80,120,180,.08), transparent 30%),
    radial-gradient(circle at 80% 10%, rgba(80,180,160,.06), transparent 30%),
    linear-gradient(180deg,#0d1117,#0a0f15);
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

.floatingPanel{
  position:fixed;
  z-index:50;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  backdrop-filter:blur(8px);
  box-shadow:var(--shadow);
  touch-action:none;
}

.panelHeader{
  display:flex;
  align-items:center;
  gap:6px;
  padding:6px 8px;
  border-bottom:1px solid rgba(255,255,255,.08);
  cursor:grab;
  user-select:none;
}

.panelHeader.dragging{
  cursor:grabbing;
}

.panelTitle{
  font-size:12px;
  color:#dbe8ff;
  font-weight:600;
  flex:1;
}

.pinBtn{
  width:22px;
  height:22px;
  border:none;
  border-radius:999px;
  font-size:11px;
  cursor:pointer;
  background:#243243;
  color:#fff;
  border:1px solid rgba(255,255,255,.12);
  padding:0;
}

.pinBtn.pinned{
  background:#304763;
  color:#ffd166;
}

#topBarPanel{
  top:8px;
  left:8px;
  right:8px;
}

#topBarBody{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  padding:8px;
}

#topBarBody button,
#settingsPanel button,
#settingsPanel select{
  background:#1e2835;
  color:var(--text);
  border:1px solid rgba(255,255,255,.12);
  border-radius:10px;
  padding:7px 10px;
  font-size:16px;
  cursor:pointer;
  -webkit-appearance:none;
  appearance:none;
}

#topBarBody button.active,
#settingsPanel button.active{
  outline:2px solid rgba(125,176,255,.55);
  background:#263448;
}

#topBarBody input{
  min-width:180px;
  flex:1 1 220px;
  background:#1e2835;
  color:var(--text);
  border:1px solid rgba(255,255,255,.12);
  border-radius:10px;
  padding:10px 12px;
  font-size:16px;
  line-height:1.2;
  outline:none;
  -webkit-appearance:none;
  appearance:none;
}

#topBarBody input:focus{
  border-color:rgba(125,176,255,.55);
  box-shadow:0 0 0 2px rgba(125,176,255,.18);
}

.spacer{
  flex:1 1 auto;
}

#settingsPanel{
  top:88px;
  left:8px;
  right:8px;
  max-height:64vh;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
  display:none;
  z-index:48;
}

#settingsPanel.open{
  display:block;
}

#settingsBody{
  padding:12px;
}

.card{
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.08);
  border-radius:12px;
  padding:10px;
  margin-bottom:10px;
}

.card h4{
  margin:0 0 8px;
  font-size:14px;
  color:#d9e8ff;
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin:8px 0;
}

.row label{
  flex:1;
  font-size:13px;
  color:var(--muted);
}

.row input[type="range"]{
  flex:1;
}

.miniNote{
  font-size:11px;
  color:#9fb2cf;
  line-height:1.45;
}

.tabRow{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:10px;
}

#hint{
  position:fixed;
  top:86px;
  right:12px;
  z-index:35;
  max-width:min(760px,84vw);
  background:rgba(5,10,18,.58);
  border:1px solid rgba(255,255,255,.08);
  border-radius:12px;
  padding:8px 10px;
  font-size:11px;
  line-height:1.5;
  backdrop-filter:blur(6px);
  pointer-events:none;
}

#modeBadge{
  position:fixed;
  left:12px;
  top:86px;
  z-index:34;
  background:rgba(0,0,0,.28);
  border:1px solid rgba(255,255,255,.12);
  border-radius:999px;
  padding:5px 10px;
  font-size:12px;
  pointer-events:none;
}

#miniInfo{
  position:fixed;
  left:12px;
  bottom:176px;
  z-index:34;
  background:rgba(0,0,0,.32);
  border:1px solid rgba(255,255,255,.12);
  border-radius:12px;
  padding:7px 10px;
  font-size:12px;
  line-height:1.45;
  min-width:300px;
  pointer-events:none;
}

#zoomHud{
  position:fixed;
  right:24px;
  bottom:124px;
  z-index:61;
  font-size:12px;
  color:#dce8ff;
  background:rgba(0,0,0,.35);
  border:1px solid rgba(255,255,255,.12);
  border-radius:9px;
  padding:4px 8px;
  min-width:52px;
  text-align:center;
  pointer-events:none;
}

#zoomControls{
  position:fixed;
  right:16px;
  bottom:16px;
  z-index:60;
  display:flex;
  flex-direction:column;
  gap:8px;
}

#zoomControls button{
  width:52px;
  height:52px;
  border:none;
  border-radius:14px;
  background:var(--panel);
  color:#eaf1ff;
  font-size:24px;
  cursor:pointer;
  border:1px solid rgba(255,255,255,.12);
  box-shadow:var(--shadow);
  -webkit-appearance:none;
  appearance:none;
}

#stickWrap{
  position:fixed;
  left:16px;
  bottom:18px;
  width:120px;
  height:120px;
  z-index:62;
  touch-action:none;
}

#stickBase{
  position:absolute;
  inset:0;
  border-radius:999px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:var(--shadow);
}

#stickKnob{
  position:absolute;
  width:56px;
  height:56px;
  left:32px;
  top:32px;
  border-radius:999px;
  background:rgba(255,255,255,.35);
  border:1px solid rgba(255,255,255,.18);
}

#logWrap{
  position:fixed;
  left:8px;
  right:8px;
  bottom:8px;
  z-index:40;
}

#logPanel{
  height:160px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:height .2s ease, opacity .2s ease, transform .2s ease;
  opacity:1;
}

#logPanel.collapsed{
  height:0;
  opacity:0;
  transform:translateY(6px);
  border:none;
}

#log{
  height:100%;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
  padding:10px 12px;
  font-size:12px;
  line-height:1.5;
  white-space:pre-wrap;
  color:#d7e4ff;
}

#nodeEditor{
  position:fixed;
  z-index:80;
  min-width:260px;
  max-width:340px;
  background:rgba(16,22,30,.96);
  border:1px solid rgba(255,255,255,.12);
  border-radius:14px;
  box-shadow:var(--shadow);
  padding:10px;
  display:none;
}

#nodeEditor.open{
  display:block;
}

#nodeEditor h3{
  margin:0 0 8px;
  font-size:14px;
}

#nodeEditor input,
#nodeEditor textarea,
#nodeEditor select{
  width:100%;
  background:#202a37;
  color:var(--text);
  border:1px solid rgba(255,255,255,.12);
  border-radius:10px;
  padding:10px;
  font-size:16px;
  line-height:1.3;
  margin-bottom:8px;
  -webkit-appearance:none;
  appearance:none;
}

#nodeEditor textarea{
  resize:vertical;
  min-height:66px;
}

#nodeEditor .buttons{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

#nodeEditor .buttons button{
  flex:1;
  min-width:70px;
  background:#243243;
  color:#fff;
  border:1px solid rgba(255,255,255,.12);
  border-radius:10px;
  padding:8px;
  cursor:pointer;
  -webkit-appearance:none;
  appearance:none;
}

#nodeDetailPanel{
  right:8px;
  top:150px;
  width:min(390px,90vw);
  display:none;
  z-index:46;
}

#nodeDetailBody{
  padding:10px;
  font-size:12px;
  line-height:1.5;
}

#legend{
  position:fixed;
  left:12px;
  bottom:12px;
  z-index:32;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  font-size:11px;
  pointer-events:none;
}

.legendItem{
  display:flex;
  align-items:center;
  gap:6px;
  background:rgba(0,0,0,.24);
  border:1px solid rgba(255,255,255,.08);
  border-radius:999px;
  padding:4px 8px;
}

.dot{
  width:10px;
  height:10px;
  border-radius:999px;
  display:inline-block;
}

@media (max-width:700px){
  #topBarBody{
    padding:6px;
    gap:5px;
  }

  #topBarBody button{
    font-size:12px;
    padding:7px 9px;
  }

  #topBarBody input{
    min-width:140px;
    font-size:16px;
    padding:10px 12px;
  }

  #hint{
    top:136px;
    right:8px;
    max-width:78vw;
    font-size:11px;
  }

  #modeBadge{
    top:136px;
  }

  #stickWrap{
    width:108px;
    height:108px;
  }

  #stickKnob{
    width:50px;
    height:50px;
    left:29px;
    top:29px;
  }

  #miniInfo{
    min-width:unset;
    max-width:78vw;
  }
}

</style>
</head>
<body>
<div id="app">
  <canvas id="canvas"></canvas>

  <div id="topBarPanel" class="floatingPanel">
    <div class="panelHeader">
      <div class="panelTitle">メインUI</div>
      <button id="pinTopBarBtn" class="pinBtn pinned">📌</button>
    </div>
    <div id="topBarBody">
      <button id="startBtn">開始</button>
      <button id="stopBtn">停止</button>
      <button id="saveBtn">保存</button>
      <button id="loadBtn">読込</button>
      <button id="fitBtn">全体表示</button>
      <button id="alignBtn">整列</button>
      <button id="settingsBtn">設定</button>
      <button id="toggleLogBtn">ログ▼</button>
      <button id="followBtn">追従:OFF</button>

      <input id="quickInput" type="text" placeholder="ノード名 / 編集名 / 検索語">

      <button id="quickEditBtn">編集✏️</button>
      <button id="quickAddBtn">新規＋✨</button>
      <button id="quickSearchBtn">検索🔍</button>

      <div class="spacer"></div>
      <button id="viewModeBtn" class="active">閲覧</button>
      <button id="editModeBtn">編集</button>
      <button id="linkModeBtn">リンク</button>
    </div>
  </div>

  <div id="settingsPanel" class="floatingPanel">
    <div class="panelHeader">
      <div class="panelTitle">設定</div>
      <button id="pinSettingsBtn" class="pinBtn pinned">📌</button>
    </div>
    <div id="settingsBody">
      <div class="tabRow">
        <button id="tabAgentBtn" class="active">エージェント</button>
        <button id="tabViewBtn">表示</button>
        <button id="tabPhysicsBtn">物理</button>
        <button id="tabDataBtn">データ</button>
      </div>

      <div id="settingsAgentSection" class="card"></div>
      <div id="settingsViewSection" class="card" style="display:none;"></div>
      <div id="settingsPhysicsSection" class="card" style="display:none;"></div>
      <div id="settingsDataSection" class="card" style="display:none;"></div>
    </div>
  </div>

  <div id="nodeDetailPanel" class="floatingPanel">
    <div class="panelHeader">
      <div class="panelTitle">ノード詳細</div>
      <button id="pinDetailBtn" class="pinBtn pinned">📌</button>
    </div>
    <div id="nodeDetailBody">未選択</div>
  </div>

  <div id="hint">
    閲覧: エージェントを選択 → 行き先ノードをタップで移動指定<br>
    編集: ダブルタップで編集 / 空白長押しで新規ノード / 画像ノードは右下ハンドルでサイズ変更<br>
    リンク: 1個目のノード選択 → 2個目で接続
  </div>

  <div id="modeBadge">モード: 閲覧</div>

  <div id="miniInfo">
    ノード: <span id="nodeCount">0</span><br>
    リンク: <span id="linkCount">0</span><br>
    選択: <span id="selectedInfo">なし</span><br>
    エージェント: <span id="agentCountMini">0</span><br>
    追従: <span id="followMini">なし</span>
  </div>

  <div id="zoomHud">100%</div>

  <div id="zoomControls">
    <button id="zoomInBtn">＋</button>
    <button id="zoomOutBtn">－</button>
  </div>

  <div id="stickWrap">
    <div id="stickBase"></div>
    <div id="stickKnob"></div>
  </div>

  <div id="logWrap">
    <div id="logPanel" class="collapsed">
      <div id="log"></div>
    </div>
  </div>

  <div id="nodeEditor">
    <h3>ノード編集</h3>
    <input id="nodeLabelInput" placeholder="表示名">
    <textarea id="nodeMemoInput" placeholder="メモ"></textarea>
    <select id="nodeColorInput">
      <option value="#2b3344">標準</option>
      <option value="#34495e">青灰</option>
      <option value="#3d2f52">紫</option>
      <option value="#324d3a">緑</option>
      <option value="#5a3b32">茶</option>
      <option value="#4e364f">桃紫</option>
    </select>
    <div class="buttons">
      <button id="nodeSaveBtn">保存</button>
      <button id="nodeDeleteBtn">削除</button>
      <button id="nodeCloseBtn">閉じる</button>
    </div>
  </div>

  <div id="legend">
    <div class="legendItem"><span class="dot" style="background:#2b3344"></span>通常</div>
    <div class="legendItem"><span class="dot" style="background:#ffd166"></span>5W2H</div>
    <div class="legendItem"><span class="dot" style="background:#7bdff2"></span>学際</div>
    <div class="legendItem"><span class="dot" style="background:#9cdcf0"></span>候補</div>
    <div class="legendItem"><span class="dot" style="background:#ff8be6"></span>エージェント</div>
  </div>
</div>

<script>
(() => {
  const SAVE_KEY = "mindmap_full_integrated_v3";

  const ROLE_DEFS = [
    { key:"unassigned", label:"未配属", defaultCount:2, color:"#9aa4b2" },
    { key:"adventurer", label:"冒険者", defaultCount:1, color:"#f28b82" },
    { key:"interdisciplinary", label:"学際", defaultCount:2, color:"#7bdff2" },
    { key:"editor", label:"編集者", defaultCount:3, color:"#c7b8ff" },
    { key:"miner", label:"採掘", defaultCount:2, color:"#ffd166" },
    { key:"painter", label:"画家", defaultCount:1, color:"#8ce99a" },
    { key:"villager", label:"村人", defaultCount:1, color:"#a5d8ff" }
  ];

  const RSS_SOURCES = [
    { name:"NHK", url:"https://www3.nhk.or.jp/rss/news/cat0.xml" },
    { name:"Yahoo", url:"https://news.yahoo.co.jp/rss/topics/top-picks.xml" }
  ];

  const RSS_STOPWORDS = new Set([
    "こと","もの","ため","これ","それ","など","よう",
    "日本","東京","全国","速報","最新","発表","判明",
    "ニュース","記事","動画","写真","会見","政府"
  ]);

  let roleCounts = Object.fromEntries(ROLE_DEFS.map(r => [r.key, r.defaultCount]));
  let totalAgentCount = Object.values(roleCounts).reduce((a,b) => a + b, 0);

  const uiState = {
    showGrid:true,
    fix5w2h:true,
    showLinkType:false,
    compactText:true,
    physics:true,
    repel:150,
    spring:10,
    damping:92,
    inter:true,
    autoExpand:true,
    expandCount:2,
    autoSave:true,
    autoSaveSec:15,
    rssEnabled:true,
    rssRefreshMin:15,
    showAgentLinks:true,
    visibleNodeLimit:Infinity,
    agentsIgnoreHiddenNodes:true
  };

  const rssState = {
    items: [],
    keywordCounts: new Map(),
    lastFetchAt: 0,
    fetching: false
  };

  let rssTimer = null;
  let visibleNodeSet = new Set();

  const DOUBLE_TAP_MS = 320;
  const DOUBLE_TAP_DIST = 26;
  const LONG_PRESS_MS = 420;

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const startBtn = document.getElementById("startBtn");
  const stopBtn = document.getElementById("stopBtn");
  const saveBtn = document.getElementById("saveBtn");
  const loadBtn = document.getElementById("loadBtn");
  const fitBtn = document.getElementById("fitBtn");
  const alignBtn = document.getElementById("alignBtn");
  const settingsBtn = document.getElementById("settingsBtn");
  const toggleLogBtn = document.getElementById("toggleLogBtn");
  const followBtn = document.getElementById("followBtn");

  const quickInput = document.getElementById("quickInput");
  const quickEditBtn = document.getElementById("quickEditBtn");
  const quickAddBtn = document.getElementById("quickAddBtn");
  const quickSearchBtn = document.getElementById("quickSearchBtn");

  const settingsPanel = document.getElementById("settingsPanel");
  const logPanel = document.getElementById("logPanel");
  const logEl = document.getElementById("log");

  const viewModeBtn = document.getElementById("viewModeBtn");
  const editModeBtn = document.getElementById("editModeBtn");
  const linkModeBtn = document.getElementById("linkModeBtn");

  const nodeCountEl = document.getElementById("nodeCount");
  const linkCountEl = document.getElementById("linkCount");
  const selectedInfoEl = document.getElementById("selectedInfo");
  const agentCountMini = document.getElementById("agentCountMini");
  const followMini = document.getElementById("followMini");
  const zoomHud = document.getElementById("zoomHud");
  const modeBadge = document.getElementById("modeBadge");

  const stickWrap = document.getElementById("stickWrap");
  const stickKnob = document.getElementById("stickKnob");

  const nodeEditor = document.getElementById("nodeEditor");
  const nodeLabelInput = document.getElementById("nodeLabelInput");
  const nodeMemoInput = document.getElementById("nodeMemoInput");
  const nodeColorInput = document.getElementById("nodeColorInput");
  const nodeSaveBtn = document.getElementById("nodeSaveBtn");
  const nodeDeleteBtn = document.getElementById("nodeDeleteBtn");
  const nodeCloseBtn = document.getElementById("nodeCloseBtn");

  const topBarPanel = document.getElementById("topBarPanel");
  const pinTopBarBtn = document.getElementById("pinTopBarBtn");
  const pinSettingsBtn = document.getElementById("pinSettingsBtn");
  const zoomInBtn = document.getElementById("zoomInBtn");
  const zoomOutBtn = document.getElementById("zoomOutBtn");

  const nodeDetailPanel = document.getElementById("nodeDetailPanel");
  const nodeDetailBody = document.getElementById("nodeDetailBody");
  const pinDetailBtn = document.getElementById("pinDetailBtn");

  const tabAgentBtn = document.getElementById("tabAgentBtn");
  const tabViewBtn = document.getElementById("tabViewBtn");
  const tabPhysicsBtn = document.getElementById("tabPhysicsBtn");
  const tabDataBtn = document.getElementById("tabDataBtn");

  const settingsAgentSection = document.getElementById("settingsAgentSection");
  const settingsViewSection = document.getElementById("settingsViewSection");
  const settingsPhysicsSection = document.getElementById("settingsPhysicsSection");
  const settingsDataSection = document.getElementById("settingsDataSection");

  let W = 0, H = 0, DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  const view = { x:0, y:0, scale:1 };

  let running = true;
  let mode = "view";
  let nodes = [];
  let links = [];
  let agents = [];
  let agentCount = 0;
  let followAgentId = null;
  let selectedNodeId = null;
  let hoveredNodeId = null;
  let linkingFromId = null;
  let editingNodeId = null;
  let pendingAgentTargetId = null;

  let autoSaveTimer = null;
  let idCounter = 1;
  let frame = 0;

  let pointerDown = false;
  let draggingNodeId = null;
  let resizingNodeId = null;
  let panning = false;
  let dragOffsetWorldX = 0;
  let dragOffsetWorldY = 0;
  let lastPointer = {x:0,y:0};

  let lastTapTime = 0;
  let lastTapX = 0;
  let lastTapY = 0;
  let longPressTimer = null;

  let searchResults = [];
  let searchIndex = 0;
  let lastSearchQuery = "";

  const panelPins = { topBarPanel:true, settingsPanel:true, nodeDetailPanel:true };
  const panelPositions = {
    topBarPanel:{left:8,top:8},
    settingsPanel:{left:8,top:88},
    nodeDetailPanel:{left:Math.max(8, window.innerWidth - 388), top:150}
  };

  const stickState = { active:false, dx:0, dy:0, max:32 };
  const FIVEW2H_LABELS = ["Who","What","When","Where","Why","How","HowMuch"];

  function addLog(text){
    const now = new Date();
    const hh = String(now.getHours()).padStart(2,"0");
    const mm = String(now.getMinutes()).padStart(2,"0");
    const ss = String(now.getSeconds()).padStart(2,"0");
    logEl.textContent += `[${hh}:${mm}:${ss}] ${text}\n`;
    logEl.scrollTop = logEl.scrollHeight;
  }

  function escHtml(str){
    return String(str ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function uniqueStrings(arr){
    return [...new Set((arr || []).filter(Boolean))];
  }

  function resize(){
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);

  function sanitizeGeneratedLabel(text){
    let s = String(text || "").trim();
    s = s.replace(/[^\p{L}\p{N}\p{Script=Han}\p{Script=Hiragana}\p{Script=Katakana}\s]/gu, "");
    const chunks = s.match(/[A-Za-z]+[0-9]*|[\p{Script=Han}\p{Script=Hiragana}\p{Script=Katakana}]+/gu) || [];
    const result = [];
    const seen = new Set();
    for(const c of chunks){
      if(seen.has(c)) continue;
      seen.add(c);
      result.push(c);
      if(result.length >= 4) break;
    }
    s = result.join(" ");
    if(!s) s = "未整理ノード";
    if(s.length > 24) s = s.slice(0, 24);
    return s;
  }

    switch(linkType){

  function getBaseNodeWeight(node){
    let w = 0;
    if(typeof node.hensachi === "number") w += node.hensachi;
    else w += 50;

    if(typeof node.attentionScore === "number") w += node.attentionScore * 2;
    if(typeof node.qualityScore === "number") w += node.qualityScore * 3;

    if(node.is5w2h) w += 30;
    if(node.isInterdisciplinary) w += 10;
    if(node.imageSrc) w += 8;
    if(node.tags?.includes("unverified")) w -= 12;
    if(node.tags?.includes("wildcard")) w += 4;

    return w;
  }

  function computeNodeDisplayWeight(node){
    let weight = getBaseNodeWeight(node);
    const relatedLinks = links.filter(l => l.source === node.id || l.target === node.id);
    weight += relatedLinks.length * 2.5;

    for(const l of relatedLinks){
      const otherId = l.source === node.id ? l.target : l.source;
      const other = getNode(otherId);
      if(!other) continue;
      const otherBase = getBaseNodeWeight(other);
      const bias = getLinkBias(l.type);
      weight += (otherBase * 0.05) * bias;
    }

    return weight;
  }

async function fetchRss(feedUrl){
  try{
    const proxy = "https://api.allorigins.win/raw?url=";
    const res = await fetch(proxy + encodeURIComponent(feedUrl));

    if(!res.ok) throw new Error("fetch failed");

    const text = await res.text();

    const parser = new DOMParser();
    const xml = parser.parseFromString(text, "text/xml");

    const items = [...xml.querySelectorAll("item")].map(item => ({
      title: item.querySelector("title")?.textContent || "",
      link: item.querySelector("link")?.textContent || ""
    }));

    return items;
  }catch(e){
    console.warn("RSS取得失敗", feedUrl, e);
    return [];
  }
}

  async function webSignalWeights(title){
    const weights = { Who:0, What:0, When:0, Where:0, Why:0, How:0 };
    const text = String(title || "");

    if(/人|者|企業|会社|住民|政府|軍|作者|利用者|メーカー/.test(text)) weights.Who += 2;
    if(/仕組み|方法|製造|設計|実装|手順|使い方|攻略/.test(text)) weights.How += 2;
    if(/理由|原因|背景|目的/.test(text)) weights.Why += 2;
    if(/場所|地域|都市|国|海峡|港|工場/.test(text)) weights.Where += 2;
    if(/時期|年|月|日|歴史|戦後|速報/.test(text)) weights.When += 2;
    if(/とは|意味|概要|性能|価格|構造|種類/.test(text)) weights.What += 2;

    try{
      const url = `https://duckduckgo.com/ac/?q=${encodeURIComponent(title)}&type=list`;
      const res = await fetch(url);
      if(res.ok){
        const data = await res.json();
        const phrases = (data || []).map(x => String(x.phrase || ""));
        const joined = phrases.join(" ");
        if(/誰|企業|メーカー|人物/.test(joined)) weights.Who += 2;
        if(/どこ|場所|地域|拠点/.test(joined)) weights.Where += 2;
        if(/いつ|時期|年/.test(joined)) weights.When += 2;
        if(/なぜ|理由|原因/.test(joined)) weights.Why += 2;
        if(/どうやって|方法|仕組み|使い方/.test(joined)) weights.How += 2;
        if(/とは|意味|性能|価格|種類|構造/.test(joined)) weights.What += 2;
      }
    }catch(err){
      console.warn("webSignalWeights suggest fetch failed", err);
    }

    return weights;
  }

    if((label.match(/Who|What|When|Where|Why|How/g) || []).length >= 2) score -= 2;

    return score;
  }

async function minerFetchRelated(targetNode, agent){
  const base = targetNode.title || targetNode.label;
  if(targetNode.wikiBusy) return "busy";
  targetNode.wikiBusy = true;

  try{
    const related = await wikiRelatedWords(base, 12);
    const webRelated = await webSuggestWords(base);
    const candidates = uniqueStrings([...related, ...webRelated]);

    if(!agent.mineState){
      agent.mineState = {
        lockedNodeId: targetNode.id,
        triedWords: [],
        exhausted: false,
        depth: 0
      };
    }

    const tried = new Set(agent.mineState.triedWords || []);
    const fresh = candidates.filter(word => {
      if(tried.has(word)) return false;
      if(nodeExistsByLabel(word)) return false;
      return true;
    });

    if(fresh.length === 0){
      agent.mineState.exhausted = true;
      return "exhausted";
    }
if(agent.mineState.depth >= 12){
  return "exhausted";
}

    const branchLimit =
      targetNode.hensachi >= 60 ? 5 :
      targetNode.hensachi >= 50 ? 4 : 3;

    let added = 0;

    for(const word of fresh){
      const child = makeNode({
        x: targetNode.x + (Math.random() - 0.5) * 220,
        y: targetNode.y + 80 + Math.random() * 140,
        label: word,
        memo: "採掘者がWikipedia/Webから取得",
        r: 20,
        color: "#2b3344",
        textColor: "#eaf1ff"
      });

      child.title = word;
      child.rootNodeId = child.id;
      child.keywords = [base, word];
      child.tags = ["miner", "wiki", "fresh"];
      child.summary = `${base} の関連要素`;
      child.qualityScore = 4;
      child.attentionScore = 1;

      nodes.push(child);
      links.push(makeLink(targetNode.id, child.id, "explore", 0.7, true));

      agent.mineState.triedWords.push(word);
      added++;
      if(added >= branchLimit) break;
    }

    agent.mineState.depth += added;
    targetNode.keywords = uniqueStrings([...(targetNode.keywords || []), ...fresh]);
    targetNode.tags = uniqueStrings([...(targetNode.tags || []), "mined"]);

    addLog(`採掘拡張: ${base} → ${added}本`);

    return added > 0 ? "expanded" : "exhausted";
  } finally {
    targetNode.wikiBusy = false;
  }
}

      .filter(n => !n.isAgentNode && !n.is5w2h)
      .map(n => Number(n.attentionScore || 0));
    scores.push(rawScore);

    const mean = scores.reduce((a,b)=>a+b,0) / Math.max(1, scores.length);
    const variance = scores.reduce((a,b)=>a + Math.pow(b - mean, 2), 0) / Math.max(1, scores.length);
    const std = Math.sqrt(variance) || 1;

    const hensachi = 50 + 10 * ((rawScore - mean) / std);
    targetNode.hensachi = Math.round(hensachi * 10) / 10;
    targetNode.tags = uniqueStrings([...(targetNode.tags || []), "village"]);

    if(!targetNode.summary){
      targetNode.summary = `${base} に対するWeb/RSS由来の観点付与`;

function addRssHeadlineAsBranch(headline){
  const rootLabel = String(headline || "").trim();
  if(!rootLabel) return null;

  let root = nodeExistsByLabel(rootLabel);
  if(!root){
    root = makeNode({
      x: view.x + (Math.random() - 0.5) * 120,
      y: view.y + (Math.random() - 0.5) * 80,
      label: rootLabel,
      memo: "RSS見出しノード",

      textColor: "#eaf1ff"
    });
    root.title = rootLabel;
    root.tags = ["rss", "headline"];
    root.summary = "RSS見出しから生成";
    root.rootNodeId = root.id;
    nodes.push(root);
  }

  const words = extractHeadlineKeywords(rootLabel).slice(0, 8);

  for(const word of words){
    let child = nodeExistsByLabel(word);

    if(!child){
      child = makeNode({
        x: root.x + (Math.random() - 0.5) * 220,
        y: root.y + 100 + Math.random() * 120,
        label: word,
        memo: "RSS見出しから抽出",
        r: 20,
        color: "#2b3344",
        textColor: "#eaf1ff"
      });
      child.title = word;
      child.rootNodeId = child.id;
      child.keywords = [rootLabel, word];
      child.tags = ["rss-keyword", "fresh"];
      child.summary = `${rootLabel} から抽出`;
      nodes.push(child);
    }

    if(!linkExists(root.id, child.id)){
      links.push(makeLink(root.id, child.id, "explore", 0.9, true));
    }
  }

  mergeDuplicateNodes();
  addLog(`RSS枝生成: ${rootLabel}`);
  return root;
}




function mergeDuplicateNodes(){
  const map = new Map();

  for(const node of [...nodes]){
    if(node.is5w2h || node.isAgentNode) continue;

    const key = normalizeTitleKey(node.title || node.label);
    if(!key) continue;

    if(!map.has(key)){
      map.set(key, node);
      continue;
    }

    const keeper = map.get(key);
    const removeId = node.id;

    for(const link of links){
      if(link.source === removeId) link.source = keeper.id;
      if(link.target === removeId) link.target = keeper.id;
    }

    keeper.tags = uniqueStrings([...(keeper.tags || []), ...(node.tags || [])]);
    keeper.keywords = uniqueStrings([...(keeper.keywords || []), ...(node.keywords || [])]);
    keeper.memo = [keeper.memo, node.memo].filter(Boolean).join("\n");
    keeper.summary = keeper.summary || node.summary;
    keeper.imageSrc = keeper.imageSrc || node.imageSrc;

    links = links.filter(l => l.source !== l.target);

    const seen = new Set();
    links = links.filter(l => {
      const a = l.source < l.target ? l.source : l.target;
      const b = l.source < l.target ? l.target : l.source;
      const k = `${a}__${b}__${l.type}`;
      if(seen.has(k)) return false;
      seen.add(k);
      return true;
    });

    nodes = nodes.filter(n => n.id !== removeId);
  }
}



function spawnFromHeadlineText(headline){

    child.tags = uniqueStrings([...(child.tags || []), "rss-seed"]);
  }

  addLog(`見出し展開: ${headline}`);
}










  function moveAgents(){
    agents.forEach(agent => {
      const agentNode = getNode(agent.id);
      if(!agentNode) return;

      let targetNode = agent.targetNodeId ? getNode(agent.targetNodeId) : null;

      if(
        targetNode &&
        uiState.agentsIgnoreHiddenNodes &&
        !targetNode.isAgentNode &&
        !visibleNodeSet.has(targetNode.id)
      ){
        agent.targetNodeId = null;
        targetNode = null;
      }

      if(!targetNode){
        const picked = pickTargetForAgent(agent);
        agent.targetNodeId = picked ? picked.id : null;
        targetNode = picked || null;
      }

      if(!targetNode){
        agent.mode = "wander";
        agent.taskText = "待機";
        return;
      }

      const dx = targetNode.x - agentNode.x;
      const dy = targetNode.y - agentNode.y;
      const dist = Math.hypot(dx, dy);

      if(dist < 36){
        agent.mode = "work";
        if(frame > (agent.workUntilFrame || 0)){
          agent.workUntilFrame = frame + 150;
        }
        return;
      }

      agent.mode = "move";
      agent.taskText = `${targetNode.title || targetNode.label} へ移動`;
      const speed = 1.5;
      agentNode.x += (dx / Math.max(1, dist)) * speed;
      agentNode.y += (dy / Math.max(1, dist)) * speed;
    });
  }

  function updateAgentThinking(frame){
    if(!running) return;

    agents.forEach(agent => {
      const agentNode = getNode(agent.id);
      let targetNode = agent.targetNodeId ? getNode(agent.targetNodeId) : null;
      if(!agentNode || agent.busy || agent.role === "unassigned") return;

      if(targetNode && uiState.agentsIgnoreHiddenNodes && !visibleNodeSet.has(targetNode.id)){
        targetNode = null;
        agent.targetNodeId = null;
      }

      if(!targetNode){
        const next = pickTargetForAgent(agent);
        agent.targetNodeId = next ? next.id : null;
        targetNode = next || null;
        if(!targetNode) return;
      }

      if(!linkExists(agentNode.id, targetNode.id)){
        links.push(makeLink(agentNode.id, targetNode.id, "agent-think", 0.5, true));
      }

      const dist = Math.hypot(targetNode.x - agentNode.x, targetNode.y - agentNode.y);

      if(dist < 36 && frame >= (agent.workUntilFrame || 0)){
        agent.busy = true;
        Promise.resolve(roleAction(agent, targetNode))
          .catch(err => {
            console.error(err);
            addLog(`役割処理エラー: ${agent.role}`);
          })
          .finally(() => {
            agent.busy = false;
            if(agent.targetNodeId === targetNode.id){
              const next = pickTargetForAgent(agent);
              agent.targetNodeId = next ? next.id : null;
            }
            agent.workUntilFrame = frame + 150;
            scheduleAutoSave();
            updateInfo();
          });
      }
    });
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawGrid(){
    if(!uiState.showGrid) return;
    const step = 80;
    const worldLeft = view.x - W/(2*view.scale);
    const worldRight = view.x + W/(2*view.scale);
    const worldTop = view.y - H/(2*view.scale);
    const worldBottom = view.y + H/(2*view.scale);
    const startX = Math.floor(worldLeft / step) * step;
    const endX = Math.ceil(worldRight / step) * step;
    const startY = Math.floor(worldTop / step) * step;
    const endY = Math.ceil(worldBottom / step) * step;

    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,.05)";
    ctx.lineWidth = 1;
    for(let x = startX; x <= endX; x += step){
      const p1 = worldToScreen(x, worldTop);
      const p2 = worldToScreen(x, worldBottom);
      ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
    }
    for(let y = startY; y <= endY; y += step){
      const p1 = worldToScreen(worldLeft,y);
      const p2 = worldToScreen(worldRight,y);
      ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
    }
    ctx.restore();
  }

  function drawLinks(){
    for(const l of links){
      const a = getNode(l.source);
      const b = getNode(l.target);
      if(!a || !b) continue;

      const isAgentLink = l.type === "agent-think" || a.isAgentNode || b.isAgentNode;
      if(isAgentLink && !uiState.showAgentLinks) continue;

      const aVisible = a.isAgentNode || visibleNodeSet.has(a.id);
      const bVisible = b.isAgentNode || visibleNodeSet.has(b.id);
      if(!aVisible || !bVisible) continue;

      const pa = worldToScreen(a.x,a.y);
      const pb = worldToScreen(b.x,b.y);

      ctx.save();
      if(l.type === "5w2h-bridge"){
        ctx.strokeStyle = "rgba(123,223,242,.78)";
        ctx.lineWidth = 2.2;
      }else if(l.type === "candidate" || l.type === "explore" || l.type === "hypothesis"){
        ctx.strokeStyle = "rgba(156,220,240,.42)";
        ctx.lineWidth = 1.2;
      }else if(l.type === "agent-think"){
        ctx.strokeStyle = "rgba(255,139,230,.28)";
        ctx.lineWidth = 1.0;
      }else{
        ctx.strokeStyle = "rgba(180,210,255,.45)";
        ctx.lineWidth = 1.6;
      }

      ctx.beginPath();
      ctx.moveTo(pa.x,pa.y);
      ctx.lineTo(pb.x,pb.y);
      ctx.stroke();

      if(uiState.showLinkType && view.scale > 0.7){
        const mx = (pa.x + pb.x)/2;
        const my = (pa.y + pb.y)/2;
        const text = l.type;
        ctx.font = "11px sans-serif";
        const tw = ctx.measureText(text).width + 10;
        ctx.fillStyle = "rgba(10,14,22,.75)";
        ctx.strokeStyle = "rgba(255,255,255,.08)";
        roundRect(mx - tw/2, my - 10, tw, 20, 8);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#dce8ff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(text, mx, my);
      }
      ctx.restore();
    }
  }

  function drawNode(n){
    if(!n.isAgentNode && !visibleNodeSet.has(n.id)) return;

    const p = worldToScreen(n.x,n.y);

    if(n.shape === "rect"){
      const rw = (n.width || 120) * view.scale;
      const rh = (n.height || 80) * view.scale;
      if(p.x < -rw || p.y < -rh || p.x > W + rw || p.y > H + rh) return;

      ctx.save();
      ctx.beginPath();
      roundRect(p.x - rw/2, p.y - rh/2, rw, rh, 12);
      ctx.fillStyle = n.color || "#2b3344";
      ctx.fill();

      if(n.imageSrc && n.imageEl){
        ctx.save();
        ctx.beginPath();
        roundRect(p.x - rw/2, p.y - rh/2, rw, rh, 12);
        ctx.clip();
        if(n.imageLoaded){
          const iw = n.imageEl.width || 1;
          const ih = n.imageEl.height || 1;
          const scale = Math.max(rw / iw, rh / ih);
          const dw = iw * scale;
          const dh = ih * scale;
          ctx.drawImage(n.imageEl, p.x - dw/2, p.y - dh/2, dw, dh);
        }else{
          ctx.fillStyle = "#334155";
          ctx.fillRect(p.x - rw/2, p.y - rh/2, rw, rh);
        }
        ctx.restore();
      }

      ctx.strokeStyle = "rgba(255,255,255,.18)";
      ctx.lineWidth = 1.5;
      if(selectedNodeId === n.id){
        ctx.strokeStyle = "#ffcc66";
        ctx.lineWidth = 3;
      }
      roundRect(p.x - rw/2, p.y - rh/2, rw, rh, 12);
      ctx.stroke();

      if(view.scale >= 0.75){
        ctx.font = `${Math.max(10, 12 * view.scale)}px sans-serif`;
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        const text = (n.title || n.label || "");
        const shortText = view.scale < 1 ? text.slice(0, 8) : text;
        ctx.fillText(shortText, p.x, p.y + rh/2 - 6);
      }

      if(mode === "edit" && selectedNodeId === n.id){
        const hs = 16;
        ctx.fillStyle = "#7db0ff";
        ctx.fillRect(p.x + rw/2 - hs/2, p.y + rh/2 - hs/2, hs, hs);
        ctx.strokeStyle = "#eaf1ff";
        ctx.lineWidth = 1;
        ctx.strokeRect(p.x + rw/2 - hs/2, p.y + rh/2 - hs/2, hs, hs);
      }
      ctx.restore();
      return;
    }

    const rr = n.r * view.scale;
    if(p.x < -120 || p.y < -120 || p.x > W + 120 || p.y > H + 120) return;

    ctx.save();
    ctx.beginPath();
    ctx.arc(p.x,p.y,rr,0,Math.PI*2);

    if(n.isAgentNode) ctx.fillStyle = roleColor(n.roleKey || "agent");
    else if(n.is5w2h) ctx.fillStyle = "#2a3140";
    else if(n.isInterdisciplinary) ctx.fillStyle = "#233848";
    else if(n.isAutoCandidate) ctx.fillStyle = "#1f2e3a";
    else ctx.fillStyle = n.color || "#2b3344";

    ctx.fill();

    if(n.is5w2h){
      ctx.strokeStyle = "#ffd166";
      ctx.lineWidth = 3;
    }else if(n.isInterdisciplinary){
      ctx.strokeStyle = "#7bdff2";
      ctx.lineWidth = 2.2;
    }else if(n.isAutoCandidate){
      ctx.strokeStyle = "#9cdcf0";
      ctx.lineWidth = 1.3;
    }else if(n.isAgentNode){
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1.8;
    }else{
      ctx.strokeStyle = "rgba(255,255,255,.18)";
      ctx.lineWidth = 1.2;
    }

    if(selectedNodeId === n.id){
      ctx.strokeStyle = "#ffcc66";
      ctx.lineWidth += 2;
    }
    if(followAgentId === n.id){
      ctx.strokeStyle = "#7db0ff";
      ctx.lineWidth += 1.5;
    }
    if(pendingAgentTargetId === n.id){
      ctx.strokeStyle = "#ff8f8f";
      ctx.lineWidth += 2;
    }
    ctx.stroke();

    const zoom = view.scale;
    const title = String(n.title || n.label || "");
    if(!uiState.compactText || zoom >= 0.9){
      const lines = title.split("\n");
      ctx.font = `${Math.max(10, 12 * zoom)}px sans-serif`;
      ctx.fillStyle = n.textColor || "#eaf1ff";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      lines.forEach((line, i) => {
        ctx.fillText(line, p.x, p.y + (i - (lines.length - 1)/2) * 13);
      });
    } else if(zoom >= 0.55){
      ctx.font = `${Math.max(9, 10 * zoom)}px sans-serif`;
      ctx.fillStyle = n.textColor || "#eaf1ff";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const shortText = title.length > 6 ? title.slice(0, 6) : title;
      ctx.fillText(shortText, p.x, p.y);
    }

    if(n.isAgentNode && zoom > 0.75){
      const agent = agents.find(a => a.id === n.id);
      if(agent){
        const status = `${roleLabelJa(agent.role)} | ${agent.mode === "move" ? "移動" : agent.mode === "work" ? "作業" : "待機"}`;
        ctx.font = "10px sans-serif";
        const tw = ctx.measureText(status).width + 12;
        const tx = p.x - tw/2;
        const ty = p.y - rr - 22;
        ctx.fillStyle = "rgba(8,10,16,.82)";
        ctx.strokeStyle = "rgba(255,255,255,.25)";
        roundRect(tx, ty, tw, 18, 8);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(status, p.x, ty + 9);
      }
    }

    ctx.restore();
  }

  function draw(){
    visibleNodeSet = getVisibleNodeSet();

  function applyRepulsion(){
    const repel = Number(uiState.repel);
    for(let i = 0; i < nodes.length; i++){
      const a = nodes[i];
      for(let j = i + 1; j < nodes.length; j++){
        const b = nodes[j];
        if(a.isAgentNode || b.isAgentNode) continue;
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        let d2 = dx * dx + dy * dy;
        if(d2 < 1) d2 = 1;
        const d = Math.sqrt(d2);
        const force = repel / d2;
        const fx = force * dx / d;
        const fy = force * dy / d;
        if(!a.fixed){ a.vx -= fx; a.vy -= fy; }
        if(!b.fixed){ b.vx += fx; b.vy += fy; }
      }
    }
  }

  function physicsStep(){
    if(!running || !uiState.physics) return;
    const spring = Number(uiState.spring) / 1000;
    const damping = Number(uiState.damping) / 100;

    nodes.forEach(n => {
      if(n.is5w2h && uiState.fix5w2h) n.fixed = true;
    });

    applyRepulsion();

    for(const l of links){
      const a = getNode(l.source);
      const b = getNode(l.target);
      if(!a || !b) continue;
      if(a.isAgentNode || b.isAgentNode) continue;

      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const d = Math.max(1, Math.hypot(dx, dy));

      let target = 160;
      if(l.type === "5w2h-bridge") target = 140;
      if(l.type === "candidate" || l.type === "explore" || l.type === "hypothesis") target = 95;

      const force = (d - target) * spring;
      const fx = force * dx / d;
      const fy = force * dy / d;

      if(!a.fixed){ a.vx += fx; a.vy += fy; }
      if(!b.fixed){ b.vx -= fx; b.vy -= fy; }
    }

    nodes.forEach(n => {
      if(n.fixed && !n.isAgentNode){
        n.vx = 0;
        n.vy = 0;
        return;
      }
      if(!n.isAgentNode){
        n.x += n.vx;
        n.y += n.vy;
        n.vx *= damping;
        n.vy *= damping;
      }
    });

    const panSpeed = 7 / view.scale;
    if(stickState.active || Math.abs(stickState.dx) > 0.01 || Math.abs(stickState.dy) > 0.01){
      view.x += stickState.dx * panSpeed;
      view.y += stickState.dy * panSpeed;
    }

    moveAgents();
    updateAgentThinking(frame);
    updateCameraFollow();
    ensure5W2HNodes();
  }

  function runQuickSearch(){
    const q = quickInput.value.trim();
    if(!q){
      addLog("検索語が空です");
      return;
    }

    if(lastSearchQuery !== q){
      searchResults = findNodesByKeyword(q);
      searchIndex = 0;
      lastSearchQuery = q;
    }else{
      searchIndex++;
    }

    if(searchResults.length === 0){
      addLog(`検索結果なし: ${q}`);
      return;
    }

    if(searchIndex >= searchResults.length) searchIndex = 0;

    const node = searchResults[searchIndex];
    if(!node){
      searchResults = [];
      searchIndex = 0;
      lastSearchQuery = "";
      addLog("検索結果が無効になりました");
      return;
    }

    focusNode(node);
    addLog(`検索ヒット ${searchIndex + 1}/${searchResults.length}: ${node.title || node.label}`);
  }







function calcNodeAffinity(a, b){
  if(!a || !b || a.id === b.id) return -Infinity;

  let score = 0;

  const aTitle = String(a.title || a.label || "");
  const bTitle = String(b.title || b.label || "");

  const aTags = new Set(a.tags || []);
  const bTags = new Set(b.tags || []);
  const aKeywords = new Set(a.keywords || []);
  const bKeywords = new Set(b.keywords || []);

  for(const t of aTags){
    if(bTags.has(t)) score += 4;
  }
  for(const k of aKeywords){
    if(bKeywords.has(k)) score += 3;
  }

  if(aTitle.includes(bTitle) || bTitle.includes(aTitle)) score += 3;

  const sameCategory = a.category && b.category && a.category === b.category;
  if(sameCategory) score += 2;

  if(a.isAutoCandidate || b.isAutoCandidate) score -= 1;
  if(a.tags?.includes("unverified")) score -= 3;
  if(b.tags?.includes("unverified")) score -= 3;

  return score;
}

  function pointerPosFromEvent(e){
    const rect = canvas.getBoundingClientRect();
    return { x:(e.clientX ?? 0) - rect.left, y:(e.clientY ?? 0) - rect.top };
  }

  function hitTestNode(worldX,worldY){
    for(let i = nodes.length - 1; i >= 0; i--){
      const n = nodes[i];
      if(!n.isAgentNode && !visibleNodeSet.has(n.id)) continue;

      if(n.shape === "rect"){
        const w = n.width || 120;
        const h = n.height || 80;
        if(
          worldX >= n.x - w/2 &&
          worldX <= n.x + w/2 &&
          worldY >= n.y - h/2 &&
          worldY <= n.y + h/2
        ) return n;
        continue;
      }
      const dx = worldX - n.x;
      const dy = worldY - n.y;
      if(dx*dx + dy*dy <= n.r*n.r) return n;
    }
    return null;
  }

  function hitResizeHandle(node, worldX, worldY){
    if(!node || node.shape !== "rect") return false;
    const hw = (node.width || 120) / 2;
    const hh = (node.height || 80) / 2;
    const handleSize = 12 / view.scale;
    const hx = node.x + hw;
    const hy = node.y + hh;
    return (
      worldX >= hx - handleSize &&
      worldX <= hx + handleSize &&
      worldY >= hy - handleSize &&
      worldY <= hy + handleSize
    );
  }

  function onCanvasPointerDown(e){
    const p = pointerPosFromEvent(e);
    const w = screenToWorld(p.x,p.y);
    const node = hitTestNode(w.x,w.y);

    pointerDown = true;
    lastPointer = p;
    hoveredNodeId = node ? node.id : null;

    clearLongPressTimer();

    if(mode === "edit" && !node){
      longPressTimer = setTimeout(() => {
        const newNode = createNodeAtWorld(w.x, w.y, quickInput.value.trim() || "新規ノード");
        selectedNodeId = newNode.id;
        syncQuickInputFromSelection();
        openEditor(newNode, p.x, p.y);
        updateInfo();
      }, LONG_PRESS_MS);
    }

    const now = Date.now();
    const isDoubleTap =
      now - lastTapTime <= DOUBLE_TAP_MS &&
      isNearPoint(p.x, p.y, lastTapX, lastTapY);

    lastTapTime = now;
    lastTapX = p.x;
    lastTapY = p.y;

    if(mode === "edit"){
      if(node){
        selectedNodeId = node.id;

        if(isDoubleTap && !node.is5w2h){
          openEditor(node, p.x, p.y);
          updateInfo();
          syncQuickInputFromSelection();
          return;
        }

        if(node.shape === "rect" && hitResizeHandle(node, w.x, w.y)){
          resizingNodeId = node.id;
        }else if(!node.fixed){
          draggingNodeId = node.id;
          dragOffsetWorldX = w.x - node.x;
          dragOffsetWorldY = w.y - node.y;
        }
      }else{
        selectedNodeId = null;
        panning = true;
      }
    }else if(mode === "view"){
      if(node){
        if(pendingAgentTargetId && !node.isAgentNode){
          const agent = agents.find(a => a.id === pendingAgentTargetId);
          if(agent){
            agent.targetNodeId = node.id;
            agent.taskText = `${node.title || node.label} へ移動指定`;
            addLog(`移動指定: ${getNode(agent.id)?.label || "Agent"} → ${node.title || node.label}`);
          }
          pendingAgentTargetId = null;
          selectedNodeId = node.id;
          updateInfo();
          syncQuickInputFromSelection();
          scheduleAutoSave();
          return;
        }

        selectedNodeId = node.id;

        if(node.isAgentNode){
          followAgentId = node.id;
          pendingAgentTargetId = node.id;
          updateFollowUI();
          addLog(`行き先指定待ち: ${node.label.replace("\n"," ")}`);
        }
      }else{
        selectedNodeId = null;
        if(!pendingAgentTargetId){
          panning = true;
        }
      }
    }else if(mode === "link"){
      if(node){
        selectedNodeId = node.id;
        if(!linkingFromId){
          linkingFromId = node.id;
          addLog(`リンク開始: ${node.title || node.label}`);
        }else if(linkingFromId === node.id){
          linkingFromId = null;
          addLog("リンク選択解除");
        }else{
          addLinkSmart(getNode(linkingFromId), node);
          linkingFromId = null;
          scheduleAutoSave();
        }
      }else{
        linkingFromId = null;
        selectedNodeId = null;
      }
    }

    updateInfo();
    syncQuickInputFromSelection();
  }

  function onCanvasPointerMove(e){
    const p = pointerPosFromEvent(e);
    const w = screenToWorld(p.x,p.y);
    const hit = hitTestNode(w.x,w.y);
    hoveredNodeId = hit ? hit.id : null;

    if(pointerDown){
      const dx = p.x - lastPointer.x;
      const dy = p.y - lastPointer.y;

      if(Math.abs(dx) > 6 || Math.abs(dy) > 6){
        clearLongPressTimer();
      }

      if(resizingNodeId){
        const node = getNode(resizingNodeId);
        if(node && node.shape === "rect"){
          node.width = Math.max(60, (w.x - node.x) * 2);
          node.height = Math.max(40, (w.y - node.y) * 2);
        }
      }else if(draggingNodeId){
        const node = getNode(draggingNodeId);
        if(node && !node.fixed){
          node.x = w.x - dragOffsetWorldX;
          node.y = w.y - dragOffsetWorldY;
          node.vx = 0;
          node.vy = 0;
        }
      }else if(panning){
        view.x -= dx / view.scale;
        view.y -= dy / view.scale;
      }
    }
    lastPointer = p;
  }

  function onCanvasPointerUp(){
    clearLongPressTimer();
    pointerDown = false;
    if(draggingNodeId || resizingNodeId) scheduleAutoSave();
    draggingNodeId = null;
    resizingNodeId = null;
    panning = false;
  }

  function onWheel(e){
    e.preventDefault();
    const mouse = pointerPosFromEvent(e);
    const before = screenToWorld(mouse.x, mouse.y);
    const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
    view.scale = Math.max(0.15, Math.min(4, view.scale * factor));
    const after = screenToWorld(mouse.x, mouse.y);
    view.x += before.x - after.x;
    view.y += before.y - after.y;
    updateZoomHud();
  }

  function handleStickMove(clientX, clientY){
    const rect = stickWrap.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    let dx = clientX - cx;
    let dy = clientY - cy;
    const len = Math.hypot(dx, dy);
    const max = stickState.max;
    if(len > max){
      dx = dx / len * max;
      dy = dy / len * max;
    }
    stickState.dx = dx / max;
    stickState.dy = dy / max;
    stickState.active = true;

    const knobRect = stickKnob.getBoundingClientRect();
    const knobW = knobRect.width || 56;
    const knobH = knobRect.height || 56;
    stickKnob.style.left = rect.width/2 - knobW/2 + dx + "px";
    stickKnob.style.top = rect.height/2 - knobH/2 + dy + "px";
  }

  function resetStick(){
    stickState.active = false;
    stickState.dx = 0;
    stickState.dy = 0;
    const baseSize = stickWrap.getBoundingClientRect();
    const knobSize = stickKnob.getBoundingClientRect();
    stickKnob.style.left = (baseSize.width - knobSize.width)/2 + "px";
    stickKnob.style.top = (baseSize.height - knobSize.height)/2 + "px";
  }

  function applyPanelLayout(){
    if(panelPins.topBarPanel){
      topBarPanel.style.left = "8px";

  function makePanelDraggable(panel, panelKey){
    const header = panel.querySelector(".panelHeader");
    let dragging = false;
    let startX = 0, startY = 0, startLeft = 0, startTop = 0;

    header.addEventListener("pointerdown", (e) => {
      if(panelPins[panelKey]) return;
      if(e.target.classList.contains("pinBtn")) return;
      dragging = true;
      header.classList.add("dragging");
      header.setPointerCapture(e.pointerId);
      const rect = panel.getBoundingClientRect();
      startX = e.clientX;
      startY = e.clientY;
      startLeft = rect.left;
      startTop = rect.top;
    });

    header.addEventListener("pointermove", (e) => {
      if(!dragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      let left = startLeft + dx;
      let top = startTop + dy;
      left = Math.max(0, Math.min(W - 80, left));
      top = Math.max(0, Math.min(H - 40, top));
      panelPositions[panelKey].left = left;
      panelPositions[panelKey].top = top;
      panel.style.left = left + "px";
      panel.style.top = top + "px";
      panel.style.right = "auto";
    });

    function endDrag(){
      dragging = false;
      header.classList.remove("dragging");
      scheduleAutoSave();
    }
    header.addEventListener("pointerup", endDrag);
    header.addEventListener("pointercancel", endDrag);
  }

function spawnHeadlineNode(headline){
  if(!headline) return;

  let root = nodeExistsByLabel(headline);

  if(!root){
    root = makeNode({
      x: view.x + (Math.random()-0.5)*200,
      y: view.y + (Math.random()-0.5)*120,
      label: headline,
      memo: "RSS見出し",
      r: 28,
      color:"#34495e"
    });
    root.title = headline;
    root.tags = ["rss","headline"];
    nodes.push(root);
  }

  // ←ここ重要
  expandHeadline(root);

  return root;
}


function expandHeadline(root){
  const words = extractHeadlineKeywords(root.title);

  for(const word of words){
    let child = nodeExistsByLabel(word);

    if(!child){
      child = makeNode({
        x: root.x + (Math.random()-0.5)*240,
        y: root.y + 120 + Math.random()*100,
        label: word,
        memo:"見出し抽出",
        r:20
      });
      child.title = word;
      child.tags = ["rss-keyword"];
      nodes.push(child);
    }

    if(!linkExists(root.id, child.id)){
      links.push(makeLink(root.id, child.id, "explore", 1, true));
    }
  }

  addLog("見出し展開: " + root.title);
}



function mergeDuplicateNodes(){
  const map = new Map();

  for(const node of [...nodes]){
    if(node.is5w2h || node.isAgentNode) continue;

    const key = normalizeTitleKey(node.title);

    if(!map.has(key)){
      map.set(key, node);
      continue;
    }

    const base = map.get(key);
    const removeId = node.id;

    // リンク移動
    for(const l of links){
      if(l.source === removeId) l.source = base.id;
      if(l.target === removeId) l.target = base.id;
    }

    // 情報統合
    base.tags = uniqueStrings([...(base.tags||[]), ...(node.tags||[])]);
    base.memo += "\n" + (node.memo || "");

    nodes = nodes.filter(n => n.id !== removeId);
  }
}

      x: view.x + (Math.random()-0.5)*200,
      y: view.y + (Math.random()-0.5)*120,
      label: headline,
      memo: "RSS見出し",
      r: 30,
      color:"#34495e"
    });

    root.title = headline;
    root.tags = ["rss","headline"];
    nodes.push(root);
  }

  expandHeadline(root);
}



function expandHeadline(root){
  const words = extractHeadlineKeywords(root.title);

  for(const word of words){
    let child = nodeExistsByLabel(word);

    if(!child){
      child = makeNode({
        x: root.x + (Math.random()-0.5)*240,
        y: root.y + 120 + Math.random()*100,
        label: word,
        memo:"見出し抽出",
        r:20
      });

      child.title = word;
      child.tags = ["rss-keyword"];
      nodes.push(child);
    }

    if(!linkExists(root.id, child.id)){
      links.push(makeLink(root.id, child.id, "explore", 1, true));
    }
  }

  addLog("見出し展開: " + root.title);
}











  function fitToAll(){
    if(!nodes || nodes.length === 0) return;

    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    nodes.forEach(n => {
      const hw = n.shape === "rect" ? (n.width || 120)/2 : (n.r || 20);
      const hh = n.shape === "rect" ? (n.height || 80)/2 : (n.r || 20);
      minX = Math.min(minX, n.x - hw);
      minY = Math.min(minY, n.y - hh);
      maxX = Math.max(maxX, n.x + hw);
      maxY = Math.max(maxY, n.y + hh);
    });

    const cx = (minX + maxX) / 2;
    const cy = (minY + maxY) / 2;
    const ww = Math.max(200, maxX - minX + 140);
    const hh = Math.max(200, maxY - minY + 140);

    view.x = cx;
    view.y = cy;
    view.scale = Math.max(0.15, Math.min(2.5, Math.min(W / ww, H / hh)));
    updateZoomHud();
  }

  function animate(){
    frame++;
    physicsStep();
    draw();
    requestAnimationFrame(animate);
  }

  startBtn.addEventListener("click", () => { running = true; addLog("開始"); });
  stopBtn.addEventListener("click", () => { running = false; addLog("停止"); });
  saveBtn.addEventListener("click", saveState);
  loadBtn.addEventListener("click", () => { if(!loadState(true)) addLog("保存データがありません"); });
  fitBtn.addEventListener("click", fitToAll);
  alignBtn.addEventListener("click", () => {
    addLog("整列は簡易版です");
    fitToAll();
  });

  settingsBtn.addEventListener("click", () => settingsPanel.classList.toggle("open"));
  toggleLogBtn.addEventListener("click", () => {
    logPanel.classList.toggle("collapsed");
    toggleLogBtn.textContent = logPanel.classList.contains("collapsed") ? "ログ▼" : "ログ▲";
  });

  followBtn.addEventListener("click", () => {
    if(followAgentId){
      followAgentId = null;
    }else if(selectedNodeId){
      const n = getNode(selectedNodeId);
      if(n && n.isAgentNode) followAgentId = n.id;
    }
    updateFollowUI();
    scheduleAutoSave();
  });

  quickAddBtn.addEventListener("click", () => {
    const text = quickInput.value.trim();
    const x = view.x + (Math.random() - 0.5) * 60;
    const y = view.y + (Math.random() - 0.5) * 60;
    const node = createNodeAtWorld(x, y, text || "新規ノード");
    selectedNodeId = node.id;
    syncQuickInputFromSelection();

    if(!text){
      const p = worldToScreen(node.x, node.y);
      openEditor(node, p.x, p.y);
    }

    updateInfo();
  });

  quickEditBtn.addEventListener("click", () => {
    const node = getNode(selectedNodeId);
    if(!node){
      addLog("編集対象ノードが未選択です");
      return;
    }

    const text = quickInput.value.trim();

    if(text){
      renameNode(node, text);
      syncQuickInputFromSelection();
      return;
    }

    const p = worldToScreen(node.x, node.y);
    openEditor(node, p.x, p.y);
  });

  quickSearchBtn.addEventListener("click", runQuickSearch);

  viewModeBtn.addEventListener("click", () => setMode("view"));
  editModeBtn.addEventListener("click", () => setMode("edit"));
  linkModeBtn.addEventListener("click", () => setMode("link"));

  tabAgentBtn.addEventListener("click", () => openSettingsTab("agent"));
  tabViewBtn.addEventListener("click", () => openSettingsTab("view"));
  tabPhysicsBtn.addEventListener("click", () => openSettingsTab("physics"));
  tabDataBtn.addEventListener("click", () => openSettingsTab("data"));

  pinTopBarBtn.addEventListener("click", () => {
    panelPins.topBarPanel = !panelPins.topBarPanel;
    applyPanelLayout();
    scheduleAutoSave();
  });

  pinSettingsBtn.addEventListener("click", () => {
    panelPins.settingsPanel = !panelPins.settingsPanel;
    applyPanelLayout();
    scheduleAutoSave();
  });

  pinDetailBtn.addEventListener("click", () => {
    panelPins.nodeDetailPanel = !panelPins.nodeDetailPanel;
    applyPanelLayout();
    scheduleAutoSave();
  });

  zoomInBtn.addEventListener("click", () => {
    view.scale = Math.min(4, view.scale * 1.15);
    updateZoomHud();
  });
  zoomOutBtn.addEventListener("click", () => {
    view.scale = Math.max(0.15, view.scale / 1.15);
    updateZoomHud();
  });

  nodeSaveBtn.addEventListener("click", () => {
    const node = getNode(editingNodeId);
    if(!node) return;
    const clean = sanitizeGeneratedLabel(nodeLabelInput.value.trim() || "無題");
    node.title = clean;
    node.label = clean;
    node.memo = nodeMemoInput.value.trim();
    node.color = nodeColorInput.value;
    node.updatedAt = Date.now();
    closeEditor();
    addLog(`ノード更新: ${clean}`);
    updateInfo();
    syncQuickInputFromSelection();
    scheduleAutoSave();
  });

  nodeDeleteBtn.addEventListener("click", () => {
    const id = editingNodeId;
    closeEditor();
    deleteNode(id);
  });

  nodeCloseBtn.addEventListener("click", closeEditor);

  canvas.addEventListener("pointerdown", onCanvasPointerDown);
  canvas.addEventListener("pointermove", onCanvasPointerMove);
  window.addEventListener("pointerup", onCanvasPointerUp);
  canvas.addEventListener("wheel", onWheel, { passive:false });

  window.addEventListener("keydown", (e) => {
    if(e.key === "Escape"){
      linkingFromId = null;
      pendingAgentTargetId = null;
      closeEditor();
      updateInfo();
    }

    if(document.activeElement === quickInput && e.key === "Enter"){
      if(mode === "edit"){
        quickAddBtn.click();
      }else{
        runQuickSearch();
      }
    }
  });

  window.addEventListener("paste", (e) => {
    const items = e.clipboardData?.items || [];
    for(const item of items){
      if(item.type && item.type.startsWith("image/")){
        const file = item.getAsFile();
        if(!file) continue;
        const reader = new FileReader();
        reader.onload = () => {
          createImageNodeAtWorld(view.x, view.y, reader.result, "貼り付け画像");
        };
        reader.readAsDataURL(file);
        e.preventDefault();
        return;
      }
    }
  });

  window.addEventListener("dragover", (e) => {
    e.preventDefault();
  });

  window.addEventListener("drop", (e) => {
    e.preventDefault();
    const files = [...(e.dataTransfer?.files || [])];
    const imageFile = files.find(f => f.type && f.type.startsWith("image/"));
    if(!imageFile) return;

    const reader = new FileReader();
    reader.onload = () => {
      const rect = canvas.getBoundingClientRect();
      const sx = e.clientX - rect.left;
      const sy = e.clientY - rect.top;
      const w = screenToWorld(sx, sy);
      createImageNodeAtWorld(w.x, w.y, reader.result, imageFile.name || "画像");
    };
    reader.readAsDataURL(imageFile);
  });

  window.addEventListener("resize", () => {
    resize();
    resetStick();
    draw();
  });

  stickWrap.addEventListener("pointerdown", (e) => {
    e.stopPropagation();
    stickWrap.setPointerCapture(e.pointerId);
    handleStickMove(e.clientX, e.clientY);
  });
  stickWrap.addEventListener("pointermove", (e) => {
    if(!stickState.active) return;
    handleStickMove(e.clientX, e.clientY);
  });
  stickWrap.addEventListener("pointerup", resetStick);
  stickWrap.addEventListener("pointercancel", resetStick);

  resize();
  renderAllSettings();
  openSettingsTab("agent");
  makePanelDraggable(topBarPanel, "topBarPanel");
  makePanelDraggable(settingsPanel, "settingsPanel");
  makePanelDraggable(nodeDetailPanel, "nodeDetailPanel");

  if(!loadState(false)){
    resetMap();
  }else{
    syncAgentsFromRoleCounts();
    renderAllSettings();
    openSettingsTab("agent");
    addLog("前回データを復元");
  }

  setMode("view");
  updateInfo();
  updateZoomHud();
  refreshRssFeeds(true);
  restartRssTimer();
  animate();
})();
</script>
