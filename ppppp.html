<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no"
  />
  <title>autophagy64_協働AIマインドマップ</title>
  <link rel="stylesheet" href="style.css?v=64" />
</head>
<body>
  <div id="app">
    <canvas id="canvas"></canvas>

    <div id="topBarPanel" class="floatingPanel">

      <div id="topBarBody">
        <button id="startBtn" type="button">▶</button>
        <button id="stopBtn" type="button">■</button>
        <button id="saveBtn" type="button">💾</button>
        <button id="loadBtn" type="button">📚</button>
        <button id="fitBtn" type="button">🦅</button>
        <button id="alignBtn" type="button">‥</button>
        <button id="settingsBtn" type="button">⚙</button>
        <button id="toggleLogBtn" type="button">ログ▼</button>
        <button id="pinTopBarBtn" class="pinBtn pinned" type="button">📌</button>
        <button id="followBtn" type="button">追従:OFF</button>

        <input
          id="quickInput"
          type="text"
          placeholder="ノード名 / 編集名 / 検索語 / YouTube URL"
          autocomplete="off"
          spellcheck="false"
        />

        <br>

        <button id="quickAddBtn" type="button">＋✨</button>
        <button id="quickEditBtn" type="button">✏️</button>
        <button id="quickSearchBtn" type="button">🔍</button>

        <div class="spacer"></div>

        <button id="viewModeBtn" class="active" type="button">👀</button>
        <button id="editModeBtn" type="button">✏️</button>
        <button id="linkModeBtn" type="button">🔗</button>
      </div>
    </div>

    <div id="settingsPanel" class="floatingPanel">
      <div class="panelHeader">
        <div class="panelTitle">設定</div>
        <button id="pinSettingsBtn" class="pinBtn pinned" type="button">📌</button>
      </div>

      <div id="settingsBody">
        <div class="tabRow">
          <button id="tabAgentBtn" class="active" type="button">👦</button>
          <button id="tabViewBtn" type="button">💡</button>
          <button id="tabPhysicsBtn" type="button">🔗</button>
          <button id="tabDataBtn" type="button">💾</button>
        </div>

        <div id="settingsAgentSection" class="card"></div>
        <div id="settingsViewSection" class="card" style="display:none;"></div>
        <div id="settingsPhysicsSection" class="card" style="display:none;"></div>
        <div id="settingsDataSection" class="card" style="display:none;"></div>
      </div>
    </div>

    <div id="nodeDetailPanel" class="floatingPanel">
      <div class="panelHeader">
        <div class="panelTitle">ノード詳細</div>
        <button id="toggleNodeDetailBtn" class="pinBtn" type="button">▼</button>
        <button id="pinDetailBtn" class="pinBtn pinned" type="button">📌</button>
      </div>
      <div id="nodeDetailBody">未選択</div>
    </div>

    <div id="zoomHud">100%</div>

    <div id="zoomControls">
      <button id="zoomInBtn" type="button">＋</button>
      <button id="zoomOutBtn" type="button">－</button>
    </div>

    <div id="stickWrap">
      <div id="stickBase"></div>
      <div id="stickKnob"></div>
    </div>

    <div id="logWrap">
      <div id="logPanel" class="collapsed">
        <div id="log"></div>
      </div>
    </div>

    <div id="nodeEditor">
      <h3>ノード編集</h3>
      <input id="nodeLabelInput" placeholder="表示名" autocomplete="off" spellcheck="false" />
      <textarea id="nodeMemoInput" placeholder="メモ"></textarea>
      <select id="nodeColorInput">
        <option value="#2b3344">標準</option>
        <option value="#34495e">青灰</option>
        <option value="#3d2f52">紫</option>
        <option value="#324d3a">緑</option>
        <option value="#5a3b32">茶</option>
        <option value="#4e364f">桃紫</option>
      </select>
      <div class="buttons">
        <button id="nodeSaveBtn" type="button">保存</button>
        <button id="nodeDeleteBtn" type="button">削除</button>
        <button id="nodeCloseBtn" type="button">閉じる</button>
      </div>
    </div>

  </div>

  <!-- YouTube Overlay -->
  <div id="youtubeOverlay" class="youtubeOverlay hidden">
    <div class="youtubeOverlayInner">
      <button id="closeYoutubeOverlayBtn" class="youtubeCloseBtn" type="button">✕</button>
      <div id="youtubePlayerWrap" class="youtubePlayerWrap"></div>
    </div>
  </div>

  <!-- 読み込み順は固定 -->
  <script src="app-state.js?v=64"></script>
  <script src="app-utils.js?v=64"></script>
  <script src="app-agents.js?v=64"></script>
  <script src="app-main.js?v=64"></script>
</body>
</html>
