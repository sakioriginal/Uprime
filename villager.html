======================= */
let worldTime = 9.0;     // 0..24
let dayCount  = 1;
let raidDoneForNight = false;
let bossDoneForNight = false;

function isNight(){
  return (worldTime >= 18.0 || worldTime < 6.0);
}
function updateTime(){
  const prevNight = isNight();
  worldTime += 0.0007;  // speed
  if(worldTime >= 24){
    worldTime -= 24;
    dayCount++;
  }
  const nowNight = isNight();

  // Night edge
  if(nowNight && !prevNight){
    raidDoneForNight = false;
    bossDoneForNight = false;
  }
  // Day edge
  if(!nowNight && prevNight){
    raidDoneForNight = false;
    bossDoneForNight = false;
  }
}

let map = new Array(MAP_W*MAP_H).fill(T_GRASS);

function inMap(x,y){ return !(x<0||y<0||x>=MAP_W||y>=MAP_H); }
function idx(x,y){ return y*MAP_W+x; }
function tile(x,y){
  if(!inMap(x,y)) return T_WALL;
  return map[idx(x,y)];
}
function setTile(x,y,t){
  if(inMap(x,y)) map[idx(x,y)] = t;
}

function isSolid(t){
  return (
    t===T_WALL ||
    t===T_HOUSE ||
    t===T_SHOP ||
    t===T_INN ||
    t===T_WALL_BUILD ||   // ←追加
    t===T_PILLAR ||
    t===T_ROOF
  );
}

function nearTileIsSolid(x,y){
  const tx = Math.floor(x), ty = Math.floor(y);

function buildVillage(cx,cy, name){
  const w=12, h=9;

  // Clear area & walls
  for(let y=-h;y<=h;y++){
    for(let x=-w;x<=w;x++){
      const wx=cx+x, wy=cy+y;
      if(!inMap(wx,wy)) continue;
      if(Math.abs(x)===w || Math.abs(y)===h){
        setTile(wx,wy,T_WALL);
      }else{
        setTile(wx,wy,T_GRASS);
      }
    }
  }

  // Gate (south)
  setTile(cx, cy+h, T_GATE);
  setTile(cx, cy+h-1, T_GATE);

  // Buildings (solid)
  const house = {x:cx-6, y:cy-4};
  const shop  = {x:cx+6, y:cy-4};
  const inn   = {x:cx+3, y:cy+2};
  setTile(house.x, house.y, T_HOUSE);
  setTile(shop.x,  shop.y,  T_SHOP);
  setTile(inn.x,   inn.y,   T_INN);

  // Town square
  const square = {x:cx, y:cy};

  return {
    name,
    cx, cy, w, h,
    gate:{x:cx, y:cy+h},
    house, shop, inn, square
  };
}

function isHouseEnclosed(startX, startY){

  const visited = new Set();
  const stack = [[startX,startY]];
  let enclosed = true;
  let tiles = [];
  let limit = 200; // ←暴走防止

  while(stack.length && limit-- > 0){

    const [x,y] = stack.pop();
    const key = x+","+y;
    if(visited.has(key)) continue;
    visited.add(key);

    if(!inMap(x,y)){
      enclosed = false;
      continue;
    }

    const t = tile(x,y);

    if(t===T_WALL_BUILD || t===T_PILLAR) continue;

    tiles.push([x,y]);

    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    for(const [dx,dy] of dirs){
      stack.push([x+dx,y+dy]);
    }
  }

  if(limit<=0) return null; // 大きすぎる

  return enclosed ? tiles : null;
}

function detectHouse(startX,startY){

  const area = isHouseEnclosed(startX,startY);
  if(!area) return;

  let floorCount = 0;
  let doorCount = 0;

  for(const [x,y] of area){
    const t = tile(x,y);

    if(t===T_FLOOR) floorCount++;
    if(t===T_DOOR) doorCount++;
  }

  if(floorCount < 4) return;  // 2x2未満
  if(doorCount < 1) return;   // ドア必須

  // 家完成！

  for(const [x,y] of area){
    if(tile(x,y)===T_FLOOR){
      setTile(x,y,T_ROOF);
    }
  }

  pushFloatText(startX,startY,"🏠 家完成！","#fff");

  hero.rep += 2;
}

  hero.exp += n;
  while(hero.exp >= hero.nextExp){

    hero.level++;
    hero.nextExp = Math.floor(hero.nextExp * 1.35 + 5);
    hero.maxHp += 12;

    hero.atk += 1;
    hero.arrows += 2;

  }
}

function addRep(n){

function acceptQuestByGiver(giverType){
  // accept first not accepted/done that matches giver
  const q = quests.find(q=>q.giver===giverType && !q.accepted && !q.done);
  if(!q){
    openDialog("今は頼みごとはないよ。", [{label:"閉じる", act: closeDialog}]);
    return;
  }
  q.accepted = true;
  openDialog(`📜 依頼：${q.title}\n${q.desc}`, [
    {label:"受けた", act: closeDialog}
  ]);
}

function checkQuests(){
  for(const q of quests){
    if(
      q.accepted &&
      !q.done &&
      typeof q.check === "function" &&
      q.check()
    ){
      q.done = true;

      if(typeof q.reward === "function"){
        q.reward();
      }

      openDialog(`✅ クエスト達成！\n${q.title}`, [
        {label:"閉じる", act: closeDialog}
      ]);
    }
  }
}

function moveNPC(n, target){
  if(!target) return;
  const dx = target.x - n.x;
  const dy = target.y - n.y;
  const d = Math.hypot(dx,dy) || 1;
  if(d > 0.12){
    const nx = n.x + dx/d*n.speed;
    const ny = n.y + dy/d*n.speed;
    // avoid solid tiles
    if(!isSolid(tile(nx|0, ny|0))){
      n.x = nx; n.y = ny;
    }
  }
}

function updateNPCs(){
  for(const n of npcs){
    if(n.type==="villager"){
      if(isNight()){
        n.target = n.home;
      }else{
        if(!n.target || Math.random()<0.004){
          const places = [
            n.home,
            n.vill.square,
            {x:n.vill.shop.x, y:n.vill.shop.y+1},
            {x:n.vill.inn.x,  y:n.vill.inn.y+1},
            {x:n.vill.square.x+3, y:n.vill.square.y-1}
          ];
          n.target = places[(Math.random()*places.length)|0];
        }
      }
      moveNPC(n, n.target);
    }

    if(n.type==="merchant" || n.type==="innkeeper"){
      // small idle wiggle
      if(!isNight() && Math.random()<0.01){
        const tx = n.home.x + (Math.random()-0.5)*0.6;
        const ty = n.home.y + (Math.random()-0.5)*0.6;
        if(!isSolid(tile(tx|0,ty|0))){
          n.x += (tx-n.x)*0.08;
          n.y += (ty-n.y)*0.08;
        }
      }else{
        moveNPC(n, n.home);
      }
    }

    if(n.type==="guard"){
      // attack enemies near
      for(const e of enemies){
        const d = Math.hypot(e.x-n.x, e.y-n.y);
        if(d < 3.0){
          e.hp -= 0.22 + hero.villageLevel*0.03;
          if(Math.random()<0.04) pushFloatText(e.x, e.y-0.55, "-G", "#fff");
        }
      }

      // patrol
      const t = n.patrol[n.patrolIndex];
      if(Math.hypot(n.x-t.x, n.y-t.y) < 0.35){
        n.patrolIndex = (n.patrolIndex+1)%n.patrol.length;
      }
      moveNPC(n, n.patrol[n.patrolIndex]);
    }
  }
}

    speed: 0.34,

    dam: Math.max(2, hero.atk)
  });

const stick = document.getElementById("stick");

function setJoyFromTouch(t){
  const r = stick.getBoundingClientRect();
  const x = t.clientX - r.left - 60;
  const y = t.clientY - r.top  - 60;
  const d = Math.hypot(x,y);
  const max = 40;
  let nx=0, ny=0;
  if(d>0.001){
    if(d>max){ nx=x/d; ny=y/d; }
    else { nx=x/max; ny=y/max; }
  }
  joy.x = nx; joy.y = ny;
  knob.style.left = (30 + joy.x*30) + "px";
  knob.style.top  = (30 + joy.y*30) + "px";
}

stick.addEventListener("touchstart", e=>{
  e.preventDefault();
  if(stopIfModalOpen()) return;
  setJoyFromTouch(e.touches[0]);
},{passive:false});

stick.addEventListener("touchmove", e=>{
  e.preventDefault();
  if(stopIfModalOpen()) return;
  setJoyFromTouch(e.touches[0]);
},{passive:false});

stick.addEventListener("touchend", ()=>{
  joy.x=joy.y=0;
  knob.style.left="30px";
  knob.style.top="30px";
},{passive:true});


canvas.addEventListener("touchstart", e=>{
  const rect = canvas.getBoundingClientRect();
  const t = e.touches[0];

  const x = t.clientX - rect.left;
  const y = t.clientY - rect.top;

  const sizeUI = 54;
  const gap = 10;

  for(let i=0;i<3;i++){
    const bx = canvas.width - sizeUI - 20;
    const by = canvas.height - (sizeUI+gap)*(3-i);

    if(x>bx && x<bx+sizeUI && y>by && y<by+sizeUI){
      selectedSlot = i;
      return;
    }
  }
});

function openDialog(text, actions){
  dlg.style.display="block";

  let html = `<div class="title">会話</div><div class="small" style="white-space:pre-line">${safe}</div>`;

    html += `<div class="row">`;
    for(let i=0;i<actions.length;i++){
      const a = actions[i];
      html += `<button data-act="${i}">${a.label}</button>`;
    }
    html += `</div>`;
  }else{
    html += `<div class="row"><button data-act="x">閉じる</button></div>`;

  dlg.querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const k = btn.getAttribute("data-act");
      if(k==="x"){ closeDialog(); return; }

    });

/* =======================
   INTERACTION (NPC / SHOP / INN / QUEST)
======================= */
function nearestVillage(){
  // pick closest to hero
  const d1 = Math.hypot(hero.x - village1.cx, hero.y - village1.cy);
  const d2 = Math.hypot(hero.x - village2.cx, hero.y - village2.cy);
  return (d1<=d2) ? village1 : village2;
}

function isInsideVillage(vill){
  return (
    hero.x >= vill.cx - (vill.w-1) &&
    hero.x <= vill.cx + (vill.w-1) &&
    hero.y >= vill.cy - (vill.h-1) &&
    hero.y <= vill.cy + (vill.h-1)
  );
}

function findNearbyNPC(){
  let best=null, bestD=999;
  for(const n of npcs){
    const d = Math.hypot(hero.x-n.x, hero.y-n.y);
    if(d<1.25 && d<bestD){
      best=n; bestD=d;
    }
  }
  return best;
}

function tryInteractNPC(){
  const n = findNearbyNPC();
  if(!n) return false;

  if(n.type==="villager"){
    // villagers can give quest; otherwise small talk
    const pending = quests.find(q=>q.giver==="villager" && !q.accepted && !q.done);
    const lines = [
      "今日はいい天気ですね。",
      "最近、街道にモンスターが出るらしい…。",
      "名声が上がると村が発展するよ！",
      "夜は怖い。門の近くにいてね。"
    ];
    const msg = `【${n.name}】\n` + (pending ? "お願いがあるの。\n（依頼を受ける？）" : lines[(Math.random()*lines.length)|0]);
    const actions = [];
    if(pending){
      actions.push({label:"依頼を受ける", act: ()=>{ closeDialog(); acceptQuestByGiver("villager"); }});
    }
    actions.push({label:"閉じる", act: closeDialog});
    openDialog(msg, actions);
    return true;
  }

  if(n.type==="merchant"){
    openShop(n.vill);
    return true;
  }

  if(n.type==="innkeeper"){
    openInn(n.vill);
    return true;
  }

  if(n.type==="guard"){
    const pending = quests.find(q=>q.giver==="guard" && !q.accepted && !q.done);
    const msg = `【${n.name}】\n` + (pending ? "依頼がある。\n（受けるか？）" : (isNight() ? "警戒しろ。夜襲が来るぞ。" : "街道の安全を頼む。"));
    const actions = [];
    if(pending){
      actions.push({label:"依頼を受ける", act: ()=>{ closeDialog(); acceptQuestByGiver("guard"); }});
    }
    // quick hint
    actions.push({label:"名声について", act: ()=>{
      openDialog("名声が20/50/90で村Lvが上がる。\n村Lvが上がると衛兵や店が強化される。", [
        {label:"OK", act: closeDialog}
      ]);
    }});
    actions.push({label:"閉じる", act: closeDialog});
    openDialog(msg, actions);
    return true;
  }

  return false;
}

function gather2(){
  // gather in front (dir or lastMoveVec)
  let fx=0, fy=0;
  if(hero.dir==="up") fy=-1;
  if(hero.dir==="down") fy=1;
  if(hero.dir==="left") fx=-1;
  if(hero.dir==="right") fx=1;
  if(lastMoveVec.mag>0.25){
    fx = lastMoveVec.x; fy = lastMoveVec.y;
    const d = Math.hypot(fx,fy)||1;
    fx/=d; fy/=d;
  }

  const tx = Math.round(hero.x + fx*0.9);
  const ty = Math.round(hero.y + fy*0.9);
  const t = tile(tx,ty);

  if(t===T_TREE){
    hero.wood++;
    setTile(tx,ty,T_GRASS);
    pushFloatText(hero.x, hero.y-0.5, "+木材", "#ffffff");
  }else if(t===T_ROAD){
    pushFloatText(hero.x, hero.y-0.5, "街道だ", "#ffffff");
  }else{
    // small chance to pick stone outside village
    const vill = nearestVillage();
    const outside = !(isInsideVillage(village1) || isInsideVillage(village2));
    if(outside && Math.random()<0.18){
      hero.stone++;
      pushFloatText(hero.x, hero.y-0.5, "+石材", "#ffffff");
    }else{
      pushFloatText(hero.x, hero.y-0.5, "採集なし", "#ffffff");
    }
  }
}

    fx = lastMoveVec.x;
    fy = lastMoveVec.y;

    fx/=d; fy/=d;
  }

  const ax = hero.x + fx*0.8;
  const ay = hero.y + fy*0.8;
  const range = 1.1;

  let hit=false;
  for(const e of enemies){
    if(Math.hypot(e.x-ax, e.y-ay) < range){
      const dmg = hero.atk + (Math.random()<0.2 ? 1 : 0);
      applyDamageEnemy(e, dmg);
      hit=true;
      break;
    }
  }
  if(!hit) pushFloatText(hero.x, hero.y-0.5, "空振り", "#ffffff");
}

function applyDamageEnemy(e, dmg){
  e.hp -= dmg;
spawnHitEffect(e.x, e.y);
shakePower = 6; // 画面揺れ

  pushFloatText(e.x, e.y-0.5, `-${dmg}`, "#ffffff");

  // ===== ノックバック =====
  const dx = e.x - hero.x;
  const dy = e.y - hero.y;
  const dist = Math.hypot(dx,dy) || 1;

  const power = (e.boss ? 0.08 : 0.18); // ボスは重い

  e.vx += (dx/dist) * power;
  e.vy += (dy/dist) * power;
}




function spawnHitEffect(x,y){

  for(let i=0;i<6;i++){
    particles.push({
      x, y,
      vx:(Math.random()-0.5)*0.2,
      vy:(Math.random()-0.5)*0.2,

    });
  }
}

/* =======================
   UPDATE LOOP
======================= */
function resolveCollision(oldX, oldY){
  // If landed in solid tile, revert axis separately
  const t = tile(hero.x|0, hero.y|0);
  if(!isSolid(t)) return;

  // try revert x
  const tryX = oldX;
  const tx = tile(tryX|0, hero.y|0);
  if(!isSolid(tx)){
    hero.x = tryX;
    return;
  }
  // try revert y
  const tryY = oldY;
  const ty = tile(hero.x|0, tryY|0);
  if(!isSolid(ty)){
    hero.y = tryY;
    return;
  }
  // revert both
  hero.x = oldX; hero.y = oldY;
}

function updateHero(){
  const speed = 0.125;

  if(stopIfModalOpen()){
    lastMoveVec.mag = 0;
    return;
  }

  const oldX = hero.x, oldY = hero.y;
  hero.x += joy.x * speed;
  hero.y += joy.y * speed;

  hero.x = Math.max(0.5, Math.min(MAP_W-1.5, hero.x));
  hero.y = Math.max(0.5, Math.min(MAP_H-1.5, hero.y));

  resolveCollision(oldX, oldY);

  const mag = Math.hypot(joy.x, joy.y);
  lastMoveVec = {x:joy.x, y:joy.y, mag};

  if(mag > 0.18){
    if(Math.abs(joy.x) > Math.abs(joy.y)) hero.dir = joy.x>0 ? "right" : "left";
    else hero.dir = joy.y>0 ? "down" : "up";
  }
}


function separateUnits(list, minDist = 0.6, force = 0.04){
  for(let i=0;i<list.length;i++){
    for(let j=i+1;j<list.length;j++){
      const a = list[i];
      const b = list[j];

      const dx = a.x - b.x;
      const dy = a.y - b.y;
      const dist = Math.hypot(dx,dy);

      if(dist > 0 && dist < minDist){
        const push = (minDist - dist) * force;
        const nx = dx / dist;
        const ny = dy / dist;

        a.x += nx * push;
        a.y += ny * push;
        b.x -= nx * push;
        b.y -= ny * push;
      }
    }
  }
}

function separateGroups(groupA, groupB, minDist=0.6, force=0.05){
  for(const a of groupA){
    for(const b of groupB){
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      const dist = Math.hypot(dx,dy);

      if(dist > 0 && dist < minDist){
        const push = (minDist - dist) * force;
        const nx = dx / dist;
        const ny = dy / dist;

        a.x += nx * push;
        a.y += ny * push;
        b.x -= nx * push;
        b.y -= ny * push;
      }
    }
  }
}


function updateEnemies(){
  for(let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    const conf = ENEMY_TYPES[e.type];

    if(e.cool>0) e.cool--;

    // target point
    let tx = hero.x, ty = hero.y;

    // Raid enemies head to their target village square
    if(e.raid && e.targetVillage){
      tx = e.targetVillage.square.x;
      ty = e.targetVillage.square.y;
      // if hero is very close, focus hero
      if(Math.hypot(hero.x-e.x, hero.y-e.y) < 6){
        tx = hero.x; ty = hero.y;
      }
    }

    const dx = tx - e.x;
    const dy = ty - e.y;
    const d = Math.hypot(dx,dy) || 1;

    if(!stopIfModalOpen()){
      if(conf.ai==="dash"){
        if(d < 5 && e.dashT<=0 && Math.random()<0.03) e.dashT = 18;
        let sp = conf.spd;
        if(e.dashT>0){ sp *= 2.4; e.dashT--; }
        if(d < 10){ e.x += dx/d * sp; e.y += dy/d * sp; }
        else{ e.x += (Math.random()-0.5)*0.015; e.y += (Math.random()-0.5)*0.015; }
      }else if(conf.ai==="boss"){
        // boss slow but relentless
        e.x += dx/d * conf.spd;
        e.y += dy/d * conf.spd;
      }else{
        if(d < 10){ e.x += dx/d * conf.spd; e.y += dy/d * conf.spd; }
        else{ e.x += (Math.random()-0.5)*0.012; e.y += (Math.random()-0.5)*0.012; }
      }
    }

    // prevent walking into solid tiles (simple)
    if(isSolid(tile(e.x|0, e.y|0))){
      // nudge back
      e.x -= dx/d * conf.spd*1.5;
      e.y -= dy/d * conf.spd*1.5;
    }

    // Attack hero (contact)
    const dh = Math.hypot(hero.x - e.x, hero.y - e.y);
    if(dh < conf.range && e.cool<=0 && !stopIfModalOpen()){
      e.cool = (e.type==="wolf") ? 26 : (e.type==="orc") ? 38 : (e.type==="boss") ? 22 : 30;
      const dmg = conf.atk + (Math.random()<0.15 ? 1 : 0);
      hero.hp -= dmg;
      pushFloatText(hero.x, hero.y-0.55, `-${dmg}`, "#ffffff");
      if(hero.hp < 0) hero.hp = 0;
    }

    // Death
    if(e.hp <= 0){
      addExp(conf.exp);
      hero.gold += (e.type==="boss") ? 25 : (e.type==="orc") ? 3 : (e.type==="wolf") ? 2 : 1;

      // boss stats
      if(e.boss){
        stats.bossesDefeated++;
        addRep(20);
        pushFloatText(hero.x, hero.y-0.6, "ボス撃破！名声+20", "#fff");
      }

      enemies.splice(i,1);
    }
  }
}

function updateProjectiles(){
  for(let i=projectiles.length-1;i>=0;i--){
    const p = projectiles[i];
    p.x += p.dx * p.speed;
    p.y += p.dy * p.speed;
    p.life--;

    // hit wall/building/tree
    const t = tile(p.x|0, p.y|0);
    if(isSolid(t) || t===T_TREE){
      projectiles.splice(i,1);
      continue;
    }

    // hit enemy
    let hit = false;
    for(const e of enemies){
      if(Math.hypot(e.x-p.x, e.y-p.y) < 0.55){
        applyDamageEnemy(e, p.dam + (Math.random()<0.2?1:0));
        hit = true;
        break;
      }
    }
    if(hit || p.life<=0 || p.x<0 || p.y<0 || p.x>=MAP_W || p.y>=MAP_H){
      projectiles.splice(i,1);
    }
  }
}

function updateNightEvents(){
  const night = isNight();

  if(night && !raidDoneForNight){
    // raid target: closest village to hero
    const vill = nearestVillage();
    spawnNightRaid(vill);
    raidDoneForNight = true;
  }

  // boss chance: requires some reputation or every few nights
  if(night && !bossDoneForNight){
    const vill = nearestVillage();
    const chance = (hero.rep>=40 ? 0.18 : 0.06) + Math.min(0.10, hero.villageLevel*0.03);
    if(Math.random() < chance){
      spawnBossRaid(vill);
      bossDoneForNight = true;
    }else{
      bossDoneForNight = true; // only once check per night
    }
  }

  // Raid defended check: if night & no raid enemies remain near target village (rough)
  if(night && raidDoneForNight){
    // if all raid enemies are gone -> defended
    const raidAlive = enemies.some(e=>e.raid);
    if(!raidAlive){
      // count once per night
      if(stats._defendedMark !== dayCount + ":" + (night?1:0)){
        stats.raidsDefended++;
        stats._defendedMark = dayCount + ":" + (night?1:0);
        addRep(10);
        pushFloatText(hero.x, hero.y-0.6, "夜襲撃退！名声+10", "#fff");
      }
    }
  }
}

/* =======================
   RENDER
======================= */
function cam(){
  const size = Math.min(canvas.width/VIEW_W, canvas.height/VIEW_H);
  const camX = hero.x - (VIEW_W/2);
  const camY = hero.y - (VIEW_H/2);
  return {size, camX, camY};
}

function drawTile(px,py,t,size){
  // base
  if(t===T_TREE) ctx.fillStyle = "#0a5";
  else if(t===T_WALL) ctx.fillStyle = "#7a7a7a";
  else if(t===T_GATE) ctx.fillStyle = "#a86";
  else if(t===T_HOUSE) ctx.fillStyle = "#d2b48c";
  else if(t===T_SHOP) ctx.fillStyle = "#ffe066";
  else if(t===T_INN) ctx.fillStyle = "#88d";
  else if(t===T_ROAD) ctx.fillStyle = "#2aa";

else if(t===T_WALL_BUILD) ctx.fillStyle="#666";
else if(t===T_DOOR) ctx.fillStyle="#964B00";
else if(t===T_ROOF) ctx.fillStyle="#b44";
else if(t===T_FLOOR) ctx.fillStyle="#ddd";



  else ctx.fillStyle = "#2d8";
  ctx.fillRect(px,py,size,size);

  // tiny detail
  if(t===T_ROAD){
    ctx.fillStyle="rgba(255,255,255,.08)";
    ctx.fillRect(px+size*0.15, py+size*0.48, size*0.70, 2);
  }
  if(t===T_GATE){
    ctx.fillStyle="rgba(0,0,0,.18)";
    ctx.fillRect(px+size*0.18, py+size*0.25, size*0.64, size*0.50);
  }
}

function drawHPBar(px,py,w,h,ratio,fill){
  ratio = Math.max(0, Math.min(1, ratio));
  ctx.fillStyle="rgba(0,0,0,.55)";
  ctx.fillRect(px,py,w,h);
  ctx.fillStyle=fill;
  ctx.fillRect(px,py,w*ratio,h);
  ctx.strokeStyle="rgba(255,255,255,.35)";
  ctx.strokeRect(px,py,w,h);
}

function drawHero(px,py,size){
  ctx.fillStyle="rgba(0,0,0,.28)";
  ctx.beginPath();
  ctx.ellipse(px+size/2, py+size*0.88, size*0.28, size*0.13, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#2e7dff";
  ctx.fillRect(px+size*0.30, py+size*0.38, size*0.40, size*0.42);

  ctx.fillStyle="#ffd9a3";
  ctx.fillRect(px+size*0.35, py+size*0.12, size*0.30, size*0.26);

  ctx.fillStyle="#000";
  const ex = (hero.dir==="right")?0.58:(hero.dir==="left")?0.40:0.49;
  const ey = (hero.dir==="down")?0.26:(hero.dir==="up")?0.16:0.20;
  ctx.fillRect(px+size*ex, py+size*ey, 3, 3);

  if(hero.attacking){
    ctx.fillStyle="#fff";
    ctx.fillRect(px+size*0.72, py+size*0.45, size*0.25, 4);
  }

  drawHPBar(px+size*0.10, py-8, size*0.80, 6, hero.hp/hero.maxHp, "rgba(120,255,120,.95)");
}

function drawEnemy(e, px, py, size){
  const conf = ENEMY_TYPES[e.type];

  ctx.fillStyle="rgba(0,0,0,.25)";
  ctx.beginPath();
  ctx.ellipse(px+size/2, py+size*0.80, size*0.22, size*0.10, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = conf.color;
  ctx.beginPath();
  ctx.arc(px+size/2, py+size*0.52, (e.boss?size*0.35:size*0.25), 0, Math.PI*2);
  ctx.fill();

  // eye
  const dx = hero.x - e.x;
  const dy = hero.y - e.y;
  const d = Math.hypot(dx,dy)||1;
  const ox = (dx/d) * (size*0.05);
  const oy = (dy/d) * (size*0.05);
  ctx.fillStyle="#000";
  ctx.fillRect(px+size*0.47 + ox, py+size*0.47 + oy, 3, 3);

  drawHPBar(px+size*0.12, py-8, size*0.76, 6, e.hp/e.maxHp, "rgba(255,120,120,.95)");

  if(e.boss){
    ctx.fillStyle="rgba(255,255,255,.25)";
    ctx.fillText("BOSS", px+size*0.50, py-14);
  }
}

function drawNPC(n, px, py, size){

  const palette = {
    villager: {body:"#ffffff", head:"#ffd9a3"},
    merchant: {body:"#ffcc66", head:"#ffd9a3"},
    innkeeper:{body:"#66ccff", head:"#ffd9a3"},
    guard:    {body:"#ff4444", head:"#ffd9a3"},
  };

  const col = palette[n.type] || palette.villager;

  // ===== 影 =====
  ctx.fillStyle="rgba(0,0,0,.28)";
  ctx.beginPath();
  ctx.ellipse(px+size/2, py+size*0.88, size*0.28, size*0.13, 0, 0, Math.PI*2);
  ctx.fill();

  // ===== 体 =====
  ctx.fillStyle = col.body;
  ctx.fillRect(px+size*0.30, py+size*0.38, size*0.40, size*0.42);

  // ===== 頭 =====
  ctx.fillStyle = col.head;
  ctx.fillRect(px+size*0.35, py+size*0.12, size*0.30, size*0.26);

  // ===== 目（主人公と同じ向きロジック）=====
  let dir = "down";
  if(Math.abs(hero.x-n.x) > Math.abs(hero.y-n.y)){
    dir = hero.x>n.x ? "right" : "left";
  }else{
    dir = hero.y>n.y ? "down" : "up";
  }

  const ex = (dir==="right")?0.58:(dir==="left")?0.40:0.49;
  const ey = (dir==="down")?0.26:(dir==="up")?0.16:0.20;

  ctx.fillStyle="#000";
  ctx.fillRect(px+size*ex, py+size*ey, 3, 3);

  // ===== 近づいた時に名前表示 =====
  if(Math.hypot(hero.x-n.x, hero.y-n.y) < 1.6){
    ctx.font = "12px monospace";
    ctx.textAlign = "center";
    ctx.fillStyle="rgba(0,0,0,.55)";
    ctx.fillText(n.name, px+size/2+1, py-10+1);
    ctx.fillStyle="#fff";
    ctx.fillText(n.name, px+size/2, py-10);
  }
}

function drawProjectiles(camX, camY, size){
  ctx.fillStyle="#fff";
  for(const p of projectiles){
    const px = (p.x - camX)*size;
    const py = (p.y - camY)*size;
    ctx.fillRect(px, py, 4, 4);
  }
}

function drawFloatTexts(camX, camY, size){
  ctx.font = "12px monospace";
  ctx.textAlign = "center";
  for(const f of floatTexts){
    const px = (f.x - camX)*size;
    const py = (f.y - camY)*size;
    ctx.fillStyle = "rgba(0,0,0,.55)";
    ctx.fillText(f.txt, px+1, py+1);
    ctx.fillStyle = f.color;
    ctx.fillText(f.txt, px, py);
  }
}

/* =======================
   RENDER
======================= */

function render(){
  const {size, camX, camY} = cam();

  ctx.fillStyle="#000";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // map
  for(let y=0;y<VIEW_H;y++){
    for(let x=0;x<VIEW_W;x++){
      const wx = (camX+x)|0;
      const wy = (camY+y)|0;
      drawTile(x*size, y*size, tile(wx,wy), size);
    }
  }

  // NPCs
  for(const n of npcs){
    const px = (n.x - camX)*size - size*0.5;
    const py = (n.y - camY)*size - size*0.5;
    if(px<-size || py<-size || px>canvas.width+size || py>canvas.height+size) continue;
    drawNPC(n, px, py, size);
  }

  // enemies
  for(const e of enemies){
    const px = (e.x - camX)*size - size*0.5;
    const py = (e.y - camY)*size - size*0.5;
    if(px<-size || py<-size || px>canvas.width+size || py>canvas.height+size) continue;
    drawEnemy(e, px, py, size);
  }

  // arrows
  drawProjectiles(camX, camY, size);

  // hero (center)
  drawHero((VIEW_W/2-0.5)*size, (VIEW_H/2-0.5)*size, size);

  // night shade
  if(isNight()){
    ctx.fillStyle = "rgba(0,0,50,0.35)";
    ctx.fillRect(0,0,canvas.width,canvas.height);
  }

  // floating texts
  drawFloatTexts(camX, camY, size);

if(buildPreviewX !== null){

  const t = tile(buildPreviewX, buildPreviewY);

  ctx.fillStyle =
    isSolid(t)
    ? "rgba(255,80,80,0.45)"
    : "rgba(255,255,255,0.35)";

  const px = (buildPreviewX - camX) * size;
  const py = (buildPreviewY - camY) * size;

  ctx.fillRect(px, py, size, size);
}


if(!buildMode){
  const t = tile(buildPreviewX, buildPreviewY);
  if(t===T_WALL_BUILD || t===T_FLOOR || t===T_DOOR){
    ctx.fillStyle="rgba(255,255,0,0.35)";
  }
}

drawQuickSlots();

}


function drawQuickSlots(){
  const sizeUI = 54;
  const gap = 10;

  for(let i=0;i<3;i++){

    const x = canvas.width - sizeUI - 20;
    const y = canvas.height - (sizeUI+gap)*(3-i);

    ctx.fillStyle="rgba(0,0,0,0.45)";
    ctx.fillRect(x,y,sizeUI,sizeUI);

    if(i===selectedSlot){
      ctx.strokeStyle="#fff";
      ctx.lineWidth=3;
      ctx.strokeRect(x,y,sizeUI,sizeUI);
    }

    ctx.fillStyle="#fff";
    ctx.font="28px sans-serif";

    const icon = getItemIcon(quickSlots[i]);
    ctx.fillText(icon, x+14, y+36);
  }
}

function saveGame(slot){

  if(localStorage.getItem(SAVE_PREFIX+slot)){
    if(!confirm("上書きしますか？")) return;
  }

  const data = {
    hero,
    worldTime,
    dayCount,
    quests,
    stats,
    buildings,
    map,
    savedAt: Date.now()
  };

  localStorage.setItem(
    SAVE_PREFIX + slot,
    JSON.stringify(data)
  );

  pushFloatText(hero.x, hero.y-0.6, `スロット${slot}に保存`, "#fff");
}


function loadGame(slot){
  const raw = localStorage.getItem(SAVE_PREFIX + slot);
  if(!raw){
    openDialog("このスロットは空です", [
      {label:"OK", act: closeDialog}
    ]);
    return;
  }




  const data = JSON.parse(raw);

  Object.assign(hero, data.hero);
  worldTime = data.worldTime;
  dayCount = data.dayCount;
  quests = data.quests;
  stats = data.stats;
  buildings = data.buildings || [];
  map = data.map || map;

  pushFloatText(hero.x, hero.y-0.6, `スロット${slot}読込`, "#fff");
}



function getSlotInfo(slot){
  const raw = localStorage.getItem(SAVE_PREFIX + slot);
  if(!raw) return "空きスロット";

  const data = JSON.parse(raw);
  const d = new Date(data.savedAt);

  return `Lv${data.hero.level} / 日${data.dayCount}
${d.toLocaleString()}`;
}

    hero.hp = hero.maxHp;
    const vill = nearestVillage();
    hero.x = vill.cx; hero.y = vill.cy+3;
    pushFloatText(hero.x, hero.y-0.6, "村に戻った", "#ffffff");
    // penalty: small gold loss
    hero.gold = Math.max(0, hero.gold - 5);
  }

  render();

  const activeQ = quests.filter(q=>q.accepted && !q.done).length;
  ui.textContent =
`HP:${hero.hp.toFixed(0)}/${hero.maxHp}  Lv:${hero.level} EXP:${hero.exp}/${hero.nextExp}
ATK:${hero.atk}  矢:${hero.arrows}  木:${hero.wood} 石:${hero.stone} 松明:${hero.torches}  G:${hero.gold}
名声:${hero.rep}  村Lv:${hero.villageLevel}  クエスト:${activeQ}
時刻:${worldTime.toFixed(0.1)} ${isNight()?"🌙 夜":"☀ 昼"}  敵:${enemies.length}
(A=会話/剣  B=袋  C=採集  D=弓)`;
ui.textContent += buildMode
  ? `\n🏗 ${buildType==="wall"?"壁":buildType==="floor"?"床":"ドア"}`
  : "";

  requestAnimationFrame(loop);

if(performance.now() % 600000 < 16){ // 約6秒ごと
  saveGame("auto");
}
}
loadGame();

requestAnimationFrame(loop);

</script>
</body>
</html>
